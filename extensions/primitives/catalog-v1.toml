id = "org.tikzarium.primitives"

[[tools]]
id = "tikz.line"
title_ru = "Линия"
syntax = "\\draw (${start_x},${start_y}) -- (${end_x},${end_y});"
help_ru = "Создаёт прямой отрезок между двумя точками штатным оператором TikZ --."
example = "\\draw (0cm,0cm) -- (2cm,1cm);"
warning_ru = "При совпадении точек отрезок вырождается; геометрия других команд не изменяется."
interaction_ru = "Координаты интерпретируются внутри действующего tikzpicture и наследуют его стили."
manual_section = "14.2.1"
manual_url = "https://tikz.dev/tikz-paths"

[tools.requirements]
packages = ["tikz"]
libraries = []
engine = "xelatex"
pgf_version_min = "UNKNOWN"
documented_against = "3.1.12"

[[tools.parameter]]
id = "start_x"
syntax = "${start_x}"
kind = "dimension"
units = ["pt", "mm", "cm", "in"]
allowed_values = []
positive = false
max_abs = 10000.0
default = "0cm"
default_provenance = "editor_preset"
help_ru = "X первой точки в координатах TikZ."
example = "0cm"
warning_ru = "Это буквальная длина с единицей, не выражение TeX; для формул используйте исходник."
interaction_ru = "Изменяет только значение start_x в создаваемой команде; другие конструкции TeX не пересчитываются."
manual_section = "14.2.1"
manual_url = "https://tikz.dev/tikz-paths"
requirements_inherit = "tool"

