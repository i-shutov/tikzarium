title_ru = "Стрелка"
syntax = "\\draw[-{${tip}}] (${start_x},${start_y}) -- (${end_x},${end_y});"
help_ru = "Чертит открытый отрезок с наконечником arrows.meta на конечной точке."
example = "\\draw[-{Stealth}] (0cm,0cm) -- (2cm,0cm);"
warning_ru = "Для Stealth и Latex необходимо явно подключить библиотеку arrows.meta; наконечники на замкнутых путях не рисуются."
interaction_ru = "Наконечник наследует толщину/цвет линии и окружающие TikZ-стили; библиотека нужна именно проекту."
manual_section = "16.2; 16.5"
manual_url = "https://tikz.dev/tikz-arrows"

