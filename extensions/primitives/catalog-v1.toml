title_ru = "Узел с текстом или математикой"
syntax = "\\node at (${x},${y}) {${content}};"
help_ru = "Вставляет TikZ node в заданной точке: text — буквальный LaTeX-текст с экранированием, math — пользовательское математическое выражение."
example = "\\node at (0cm,0cm) {A};"
warning_ru = "Для кириллицы требуется подходящий настроенный шрифт в исходном документе; math является raw TeX и не проходит песочницу."
interaction_ru = "mode влияет только на интерпретацию content; неизвестные макросы в остальном документе не анализируются."
