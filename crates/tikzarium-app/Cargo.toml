[package]
name = "tikzarium-app"
default-run = "tikzarium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tikzarium-core = { path = "../tikzarium-core" }
tikzarium-extensions = { path = "../tikzarium-extensions" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json = "1"
tempfile.workspace = true
# The Linux x86_64 X11 desktop uses the system's XDG desktop portal.
# The application does not install/run a private portal or TeX distribution.
rfd = "0.15"
