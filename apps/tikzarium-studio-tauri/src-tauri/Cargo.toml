[package]
name = "tikzarium-studio-tauri"
version = "1.0.0-rc.1"
description = "TikZarium Studio — нативная десктопная IDE на базе Tauri v2 + Rust поверх tikzarium-core и tikzarium-extensions"
authors = ["TikZarium Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/i-shutov/tikzarium"
edition = "2024"
rust-version = "1.91"

[lib]
name = "tikzarium_studio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
notify = "8"
tempfile = "3.23"
thiserror = "2"
tikzarium-core = { path = "../../../crates/tikzarium-core" }
tikzarium-extensions = { path = "../../../crates/tikzarium-extensions" }

# Изолированный workspace гарантирует, что корневой Cargo.lock (I40 qa_cargo_lock.py / --locked)
# и неизменный B42 lease в crates/tikzarium-app/src остаются на 100% нетронутыми.
[workspace]
