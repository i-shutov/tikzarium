name: I47 B35 real X11 native TikZ six gestures, held Undo and PDF
on:
  push:
    branches:
      - qa/i46-b34-dirty-open-real-x11
      - qa/i45-b31-zoom-label-live-reaccept
      - qa/i43-b31-compact-real-x11
      - qa/i26-b27-live-undo-x11
      - feat/b27-egui-undo-held-pointer-20261101
      - main
    paths:
      - '.github/workflows/n1-desktop-smoke.yml'
      - 'scripts/qa_n1_desktop.py'
      - 'scripts/tests/test_qa_n1_desktop.py'
      - 'fixtures/qa/n1-desktop-x11-1366.json'
      - 'crates/tikzarium-app/**'
      - 'crates/tikzarium-extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'plans/2026-11-01_I46_B35_DIRTY_OPEN_REAL_X11.md'
      - 'insights/2026-11-01_I46_B35_REAL_OPEN_QA.md'
      - 'CHANGELOG.md'
  pull_request:
    branches:
      - b/b32-safe-open-source-undo-20261101
      - feat/b27-egui-undo-held-pointer-20261101
      - b/b31-compact-xelatex-fit
      - main
    paths:
      - '.github/workflows/n1-desktop-smoke.yml'
      - 'scripts/qa_n1_desktop.py'
      - 'scripts/tests/test_qa_n1_desktop.py'
      - 'fixtures/qa/n1-desktop-x11-1366.json'
      - 'crates/tikzarium-app/**'
      - 'crates/tikzarium-extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'plans/2026-11-01_I46_B35_DIRTY_OPEN_REAL_X11.md'
      - 'insights/2026-11-01_I46_B35_REAL_OPEN_QA.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i47-desktop-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TIKZARIUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TIKZARIUM_QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TIKZARIUM_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
      - name: Verify tested checkout and exact screenshot-reviewed app tree
        run: |
          test "$(git rev-parse HEAD)" = "$TIKZARIUM_SOURCE_SHA"
          echo "TIKZARIUM_APP_TREE_SHA=$(git rev-parse HEAD:crates/tikzarium-app/src)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD:crates/tikzarium-app/src)" = '46aced2dbe1b66ba10d8cc92292024625e73936b'
      - name: Install isolated hosted GUI and external XeLaTeX prerequisites
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth openbox xdotool xclip imagemagick libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev \
            texlive-xetex texlive-latex-extra texlive-pictures poppler-utils fonts-dejavu-core
      - name: Offline evidence predicate tests, never called desktop acceptance
        run: python3 -m unittest discover -s scripts/tests -p test_qa_n1_desktop.py -v
      - name: I40 immutable locked egui build and dependency graph provenance
        run: |
          mkdir -p "$RUNNER_TEMP/i19-build-evidence"
          python3 -m unittest discover -s scripts/tests -p test_qa_cargo_lock.py -v
          python3 scripts/qa_cargo_lock.py --report "$RUNNER_TEMP/i19-build-evidence/lock-evidence.json"
          cargo build --locked -p tikzarium-app --bin tikzarium-app
          git diff --exit-code -- Cargo.lock
          cp Cargo.lock "$RUNNER_TEMP/i19-build-evidence/Cargo.lock"
      - name: Real B35 X11 held-pointer Undo, six gestures, GUI XeLaTeX, compact Fit Page/Fit width
        run: |
          mkdir -p "$RUNNER_TEMP/i19-runtime"
          chmod 700 "$RUNNER_TEMP/i19-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/i19-runtime"
          xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' \
            bash -c 'openbox --sm-disable >/tmp/i19-openbox.log 2>&1 & python3 scripts/qa_n1_desktop.py --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" --output "$RUNNER_TEMP/i19-evidence" --profile fixtures/qa/n1-desktop-x11-1366.json'
      - name: Upload complete real evidence, including original clipboard bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i47-b34-desktop-${{ env.TIKZARIUM_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/i19-evidence/*.json
            ${{ runner.temp }}/i19-evidence/*.png
            ${{ runner.temp }}/i19-evidence/*.tex
            ${{ runner.temp }}/i19-evidence/*.pdf
            ${{ runner.temp }}/i19-evidence/*.log
            ${{ runner.temp }}/i19-evidence/*.txt
            ${{ runner.temp }}/i19-build-evidence/lock-evidence.json
            ${{ runner.temp }}/i19-build-evidence/Cargo.lock
          if-no-files-found: warn
