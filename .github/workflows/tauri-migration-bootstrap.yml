name: Tauri migration bootstrap and first real preflight

on:
  push:
    branches: [integration/tauri-primary-20261117]
    paths:
      - '.github/workflows/tauri-migration-bootstrap.yml'
      - 'apps/tikzarium-studio-tauri/**'
      - 'scripts/qa_tauri_*'
      - 'crates/tikzarium-core/**'
      - 'crates/tikzarium-extensions/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: tauri-migration-bootstrap
  cancel-in-progress: false

jobs:
  archive-baselines:
    if: github.ref == 'refs/heads/integration/tauri-primary-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create immutable annotated archive tags, never a stable release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tauri-bootstrap"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          refs = {
              'archive/main-before-tauri-20261117': '0a9831404687296a5467f89e77e873de8cdc5137',
              'archive/egui-cp09-20261117': 'c057fc3c0b350a1405bf1305b3780a2aa550e144',
          }
          pending = []
          for tag, sha in refs.items():
              remote = git('ls-remote', '--tags', 'origin', 'refs/tags/' + tag)
              if remote:
                  actual = git('rev-parse', tag + '^{commit}')
                  if actual != sha:
                      raise SystemExit(f'Refusing to replace existing {tag}: {actual}')
              else:
                  branch = 'main' if 'main-before' in tag else 'feat/studio-scientific-integration-20261112'
                  branch_sha = git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch).split()[0]
                  if branch_sha != sha:
                      raise SystemExit(f'Baseline branch moved: {branch}: {branch_sha}')
                  git('tag', '-a', tag, sha, '-m',
                      'Owner-authorized 2026-11-17 pre-Tauri archive. Exact source checkpoint; not stable Scientific Studio acceptance. Native CP09 evidence remains pinned to 92a01f2a. No release publication.')
                  pending.append('refs/tags/' + tag)
          if pending:
              subprocess.run(['git', 'push', '--atomic', 'origin', *pending], check=True)
          verified = []
          for tag, sha in refs.items():
              rows = git('ls-remote', '--tags', 'origin', 'refs/tags/' + tag, 'refs/tags/' + tag + '^{}').splitlines()
              peeled = [line.split()[0] for line in rows if line.endswith('^{}')]
              if peeled != [sha]:
                  raise SystemExit(f'Annotated remote tag verification failed: {tag}: {rows}')
              verified.append({'tag': tag, 'commit_sha': sha, 'remote_rows': rows})
          report = {'status': 'PASS_REMOTE_ANNOTATED_TAGS', 'source_sha': os.environ['GITHUB_SHA'],
                    'tags': verified, 'stable_release_published': False,
                    'subagents_launched': 0, 'scope': 'Archive refs only; no platform acceptance'}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tauri-bootstrap/tags.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Capture portable source for audit, excluding font binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tauri-bootstrap"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tauri-bootstrap'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          omitted, records = [], []
          with zipfile.ZipFile(out / 'source-snapshot.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  if not name: continue
                  path = pathlib.Path(name)
                  if path.suffix.lower() in {'.ttf', '.otf', '.ttc', '.woff', '.woff2', '.eot', '.pdf', '.zip', '.gz'}:
                      omitted.append(name); continue
                  if path.is_symlink() or not path.is_file():
                      omitted.append(name); continue
                  data = path.read_bytes()
                  z.writestr(name, data)
                  records.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
              z.writestr('AUDIT_SOURCE_MANIFEST.json', json.dumps({'source_sha': os.environ['GITHUB_SHA'], 'files': records, 'omitted': omitted}, indent=2))
          PY
      - name: Preserve archive receipts and source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-bootstrap-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tauri-bootstrap/
          retention-days: 14
          if-no-files-found: error

  frontend:
    needs: archive-baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/tikzarium-studio-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record environment and resolve application dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tauri-frontend"
          { node --version; npm --version; git rev-parse HEAD; } | tee "$RUNNER_TEMP/tauri-frontend/environment.log"
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/tauri-frontend/install.log"
          else
            npm install --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/tauri-frontend/install.log"
          fi
      - name: Frontend tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/tauri-frontend/tests.log"
      - name: TypeScript check
        if: success() || failure()
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/tauri-frontend/typecheck.log"
      - name: Production frontend bundle
        if: success() || failure()
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/tauri-frontend/build.log"
      - name: Preserve frontend evidence and resolved lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tauri-frontend/
            apps/tikzarium-studio-tauri/package-lock.json
          retention-days: 14
          if-no-files-found: warn

  rust-host:
    needs: archive-baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
          components: rustfmt, clippy
      - name: Install hosted Linux native build dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tauri-rust"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
          { rustc -vV; cargo --version; git rev-parse HEAD; } | tee "$RUNNER_TEMP/tauri-rust/environment.log"
      - name: Test actual isolated Tauri Rust host
        working-directory: apps/tikzarium-studio-tauri/src-tauri
        run: |
          set -euo pipefail
          if test -f Cargo.lock; then
            cargo test --locked 2>&1 | tee "$RUNNER_TEMP/tauri-rust/tests.log"
          else
            cargo test 2>&1 | tee "$RUNNER_TEMP/tauri-rust/tests.log"
          fi
      - name: Preserve Rust evidence and resolved lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tauri-rust/
            apps/tikzarium-studio-tauri/src-tauri/Cargo.lock
          retention-days: 14
          if-no-files-found: warn
