name: W3 Win10 Default desktop probe (hosted unit only)
on:
  pull_request:
    paths:
      - 'scripts/workstation/windows10/Invoke-TikZarium-W3-DefaultDesktop-Probe.ps1'
      - '.github/workflows/qa-w3-win10-default-desktop-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-51-selftest:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PowerShell 5.1 parse and pure desktop-context tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/workstation/windows10/Invoke-TikZarium-W3-DefaultDesktop-Probe.ps1'
          $tokens = $null; $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw ($errors | Out-String) }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Action SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Default desktop selftest failed' }
          Write-Host 'HOSTED_READONLY_TEST_PASS_NOT_PHYSICAL_W3'
