# B42 six native GUI gestures, persisted source, external XeLaTeX PDF.
# Exact B42 source-tree lease is fail-closed. Current Linux/X11 probe includes real Open/Undo/F1; Inspector Apply and physical OS remain NOT_RUN until independently accepted.
name: I61 B42 real Studio icon-to-native-source/PDF (independent D QA)
on:
  push:
    branches: [qa/i61-b42-studio-source-pdf, main]
    paths:
      - '.github/workflows/i61-b42-studio-x11.yml'
      - 'scripts/qa_i61_b42_studio_x11.py'
      - 'scripts/qa_n2_studio_x11.py'
      - 'scripts/qa_n1_desktop.py'
      - 'scripts/tests/test_qa_i61_studio_fonts.py'
      - 'crates/**'
      - 'extensions/primitives/catalog-v1.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/i61-b42-studio-x11.yml'
      - 'scripts/qa_i61_b42_studio_x11.py'
      - 'scripts/qa_n2_studio_x11.py'
      - 'scripts/qa_n1_desktop.py'
      - 'scripts/tests/test_qa_i61_studio_fonts.py'
      - 'crates/**'
      - 'extensions/primitives/catalog-v1.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i61-studio-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  studio-full-vertical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
      - name: Exact B42 app source-tree lease (fail closed before GUI)
        run: |
          test "$(git rev-parse HEAD:crates/tikzarium-app/src)" = '22d81b273f62f3f1862d6cb12c099a83f9bbfec5'
          # Catch disagreement between workflow and Python QA before heavy TeX install.
          grep -Fqx "APP_TREE = \"$(git rev-parse HEAD:crates/tikzarium-app/src)\"" scripts/qa_i61_b42_studio_x11.py
          echo "TIKZARIUM_APP_TREE_SHA=$(git rev-parse HEAD:crates/tikzarium-app/src)" >> "$GITHUB_ENV"
          echo "TIKZARIUM_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --exit-code -- Cargo.lock
      - name: Font-audit offline contract tests (NOT GUI)
        run: python3 -m unittest discover -s scripts/tests -p test_qa_i61_studio_fonts.py -v
      - name: Hosted Linux/X11 and external TeX Live XeLaTeX prerequisites
        run: |
          # Exact f3aa1ea run cancelled after 45min downloading 129MB apt packages.
          # Avoid the observed severely slow Azure archive and bound HTTP stalls.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends \
            xvfb xauth openbox xdotool xclip imagemagick libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libudev-dev \
            texlive-xetex texlive-latex-extra texlive-pictures poppler-utils fonts-dejavu-core
          xelatex --version | head -n 2
          command -v pdffonts
      - name: Compile locked production egui binary, no QA stub
        run: |
          cargo build --locked -p tikzarium-app --bin tikzarium-app
          git diff --exit-code -- Cargo.lock
      - name: Real group icon, all six pointers, source Save and XeLaTeX PDF
        run: |
          mkdir -p "$RUNNER_TEMP/i61-runtime"
          chmod 700 "$RUNNER_TEMP/i61-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/i61-runtime"
          xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' \
            bash -c 'openbox --sm-disable >/tmp/i61-openbox.log 2>&1 & python3 scripts/qa_i61_b42_studio_x11.py --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" --out "$RUNNER_TEMP/i61-evidence"'
      - name: Real N2 Studio Library Connect/Undo/Save/Open and XeLaTeX PDF
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' \
            bash -c 'openbox --sm-disable >/tmp/n2-openbox.log 2>&1 & python3 scripts/qa_n2_studio_x11.py --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" --out "$RUNNER_TEMP/n2-evidence"'
      - name: Upload actual GUI screenshots, saved source, PDF, log and SHA ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i61-b42-source-pdf-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/i61-evidence/
            ${{ runner.temp }}/n2-evidence/
          if-no-files-found: warn
