name: TikZarium CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-native:
    name: Rust native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target_name: windows-x64
            executable_suffix: .exe
          - os: macos-15
            target_name: macos-arm64
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      # Build exact review HEAD, not GitHub's synthetic PR merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - name: Toolchain and native target
        run: rustc -vV
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact HEAD checkout for release provenance
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os,subprocess,sys; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); expected=os.environ['SOURCE_SHA']; print('source',actual,'expected',expected); sys.exit(0 if actual==expected else 1)"
      - name: Verify physical architecture of hosted runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustc -vV | grep -F 'host: aarch64-apple-darwin'
      - name: I40 audited Cargo.lock and fail-closed provenance / hosted native
        run: |
          python -m unittest discover -s scripts/tests -p test_qa_cargo_lock.py -v
          python scripts/qa_cargo_lock.py --report .qa-artifacts/lock-${{ matrix.target_name }}.json
      - name: Offline W2 Mesa official transport SHA and HTTP-failure negative contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . ./scripts/tools/qa_windows_mesa_transport.ps1
          Invoke-TikzariumMesaTransportSelfTest
      - name: Windows administrator token audit (read-only; NOT GUI/PDF proof)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s scripts/tools -p test_qa_windows_token.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows token release contract tests failed' }
          $s = & ./scripts/tools/qa_windows_token.ps1
          New-Item -ItemType Directory -Force .qa-artifacts | Out-Null
          $s | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 .qa-artifacts/windows-token.json
          if ($null -eq $s.token_is_elevated -or $s.token_integrity_rid -lt 4096) { throw 'Windows token audit incomplete' }
      - name: Explore restricted-token rights on disposable Windows without spawning a child
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tools -p test_qa_windows_restricted_report.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Restricted/LUA token negative contract tests failed' }
          ./scripts/tools/qa_windows_restricted_token_candidate.ps1 -OutputPath '.qa-artifacts/windows-restricted-token-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'Restricted/LUA native Win32 probe failed' }
          python scripts/tools/qa_windows_restricted_report.py '.qa-artifacts/windows-restricted-token-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'Restricted/LUA report classification inconsistent' }
      - name: Same-admin MEDIUM restricted suspended-child feasibility (hosted only, NO TeX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tools -p test_qa_windows_medium_child_report.py -v
          if ($LASTEXITCODE -ne 0) { throw 'MEDIUM child negative contracts failed' }
          ./scripts/tools/qa_windows_medium_child_candidate.ps1 -OutputPath '.qa-artifacts/windows-medium-child-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'MEDIUM child native probe failed' }
          python scripts/tools/qa_windows_medium_child_report.py '.qa-artifacts/windows-medium-child-candidate.json'
          if ($LASTEXITCODE -ne 0) { throw 'MEDIUM child claims contradict actual tokens' }
      - name: Preserve original hosted MEDIUM child JSON even on failure
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-medium-restricted-child-research
          path: .qa-artifacts/windows-medium-child-candidate.json
          if-no-files-found: warn
      - name: Same-admin UAC-linked suspended-child candidate (hosted only; NO TeX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tools -p test_qa_windows_filtered_child_candidate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Filtered-child static contract failed' }
          ./scripts/tools/qa_windows_filtered_child_candidate.ps1 -OutputPath '.qa-artifacts/windows-filtered-child-candidate.json'
          $result = Get-Content '.qa-artifacts/windows-filtered-child-candidate.json' -Raw | ConvertFrom-Json
          if ($result.TexPdf -cne 'NOT_RUN' -or $result.ApprovedLauncher -ne $false -or
              $result.AccountPolicyChanged -ne $false) { throw 'Child experiment cannot approve or launch TeX' }
          if ($result.Status -eq 'SUSPENDED_LIMITED_CHILD_CANDIDATE_NOT_APPROVED' -and
              ($result.ChildElevated -or -not $result.ChildSameUser -or
               $result.ChildElevationType -ne 3 -or -not $result.ChildSameSession -or
               $result.ChildIntegrity -lt 8192 -or $result.ChildIntegrity -ge 12288 -or
               -not $result.ChildTerminationConfirmed)) {
            throw 'Child token claim contradicts actual Windows token fields'
          }
      - name: Check source formatting
        run: cargo fmt --all -- --check
      - name: Check crates compile
        run: cargo check --locked --workspace --all-targets
      - name: Tests
        run: cargo test --locked --workspace
      - name: Virtual GUI JSONL API / real egui widget frames and semantic source transactions
        run: |
          python scripts/tests/test_qa_control_api.py --report .qa-artifacts/qa-control-${{ matrix.target_name }}.json
      - name: API v0 all-command black-box coverage matrix
        run: |
          python scripts/tests/test_qa_control_matrix.py --report .qa-artifacts/qa-control-matrix-${{ matrix.target_name }}.json
      - name: Upload headless GUI API contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-qa-control-${{ matrix.target_name }}
          path: |
            .qa-artifacts/qa-control-${{ matrix.target_name }}.json
            .qa-artifacts/qa-control-matrix-${{ matrix.target_name }}.json
          if-no-files-found: warn
      - name: I06 source-save integrity (no-op, external change and symlink)
        run: cargo test --locked -p tikzarium-core document::tests -- --nocapture
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Release binary
        run: cargo build --locked --release -p tikzarium-app -p tikzarium-cli
      - name: "Windows portable CRT: negative tests and actual release PE imports"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_qa_windows_crt.py -v
          if ($LASTEXITCODE -ne 0) { throw 'PE import parser negative tests failed' }
          python scripts/qa_windows_crt.py target/release/tikzarium-app.exe target/release/tikzarium-cli.exe
          if ($LASTEXITCODE -ne 0) { throw 'Portable EXE depends on external VC runtime or has invalid imports' }
      - name: Verify real release PE Windows GUI and CLI role
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from package_n5_preview import WIN, check_binary; check_binary(Path('target/release/tikzarium-app.exe').read_bytes(), WIN, role='app'); check_binary(Path('target/release/tikzarium-cli.exe').read_bytes(), WIN, role='cli'); print('Windows PE GUI=2 CLI=3 PASS')"
      - name: "Windows x64 portable ZIP: original release binary SHA, manifest, extracted CLI"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $destination='.qa-artifacts/windows-portable'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          python -m unittest discover -s scripts/tests -p test_qa_windows_portable.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP independent negative unit tests failed' }
          $app='target/release/tikzarium-app.exe'
          $cli='target/release/tikzarium-cli.exe'
          $appSha=(Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant()
          $cliSha=(Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash.ToLowerInvariant()
          $output="$destination/Tikzarium-Windows-x64-portable-candidate.zip"
          $ciUrl="https://github.com/i-shutov/tikzarium/actions/runs/$env:GITHUB_RUN_ID"
          python scripts/package_n5_preview.py --platform windows10-x64 --app $app --cli $cli --app-sha256 $appSha --cli-sha256 $cliSha --source-sha $env:SOURCE_SHA --ci-run-url $ciUrl --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Offline Windows ZIP packaging failed' }
          python scripts/qa_windows_portable.py --zip $output --app $app --cli $cli --source-sha $env:SOURCE_SHA --report "$destination/windows-zip-audit.json" --run-extracted-cli
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable ZIP original binary/manifest/actual CLI gate failed' }
      - name: Verify original Windows native/ZIP bytes with personal-server verifier on hosted CI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/tests/test_qa_windows_server_stage_integration.py --source-sha $env:SOURCE_SHA --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Genuine ZIP manifest and tamper regression failed' }
          ./scripts/tools/qa_windows_server_stage.ps1 -NativeRoot '.' -PortableRoot '.qa-artifacts/windows-portable' -OutputDir '.qa-artifacts/windows-trusted-transfer' -ExpectedSha $env:SOURCE_SHA -SourceRunId "$env:GITHUB_RUN_ID" -VerificationHost hosted-ci
      - name: Upload independent trusted Windows transfer report (not personal Server acceptance)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-windows-trusted-transfer
          path: .qa-artifacts/windows-trusted-transfer/windows-server-hosted-artifact.json
          if-no-files-found: warn
      - name: Upload Windows portable ZIP and original audit (NOT Win10 GUI proof)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-windows-x64-portable-candidate
          path: .qa-artifacts/windows-portable/
          if-no-files-found: warn
      # QA-only original pal1000 26.2.6 escrow from exact same successful
      # trusted-main push CI that supplies personal W1 native EXE/portable ZIP.
      # A network failure may omit this artifact but must never fake W0/W1.
      - name: Optional exact-SHA pal1000 escrow for private Windows Server W2 QA
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: powershell
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_CI_RUN_ID: ${{ github.run_id }}
        run: |
          ./scripts/tools/qa_windows_mesa_escrow.ps1 -OutputDir '.qa-artifacts/w2-mesa-qa-escrow' -ExpectedSourceSha $env:SOURCE_SHA -SourceRunId $env:SOURCE_CI_RUN_ID
      - name: Upload optional original pal1000 QA escrow separate from product binaries
        if: always() && runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-w2-pal1000-qa-escrow
          path: |
            .qa-artifacts/w2-mesa-qa-escrow/mesa3d-26.2.6-release-mingw.7z
            .qa-artifacts/w2-mesa-qa-escrow/qa-escrow-provenance.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-windows-server-build
          path: |
            target/release/tikzarium-app.exe
            target/release/tikzarium-cli.exe
            .qa-artifacts/lock-windows-x64.json
            .qa-artifacts/windows-token.json
            .qa-artifacts/windows-restricted-token-candidate.json
            .qa-artifacts/windows-filtered-child-candidate.json
            .qa-artifacts/windows-medium-child-candidate.json
          if-no-files-found: error
      - name: Upload macOS ARM64 binaries
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-macos-arm64-build
          path: |
            target/release/tikzarium-app
            target/release/tikzarium-cli
            .qa-artifacts/lock-macos-arm64.json
          if-no-files-found: error

  xelatex-linux-smoke:
    name: XeLaTeX real fixtures / Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: N3 real offline shared-catalogue CLI smoke (no installed XeLaTeX needed)
        env:
          TIKZARIUM_XELATEX: /does-not-exist/tikzarium-xelatex
        run: |
          mkdir -p /tmp/tikzarium-ci
          cargo run --locked -p tikzarium-cli -- help --all > /tmp/tikzarium-ci/help-all.txt
          cargo run --locked -p tikzarium-cli -- help tikz.arrow:tip > /tmp/tikzarium-ci/help-tip.txt
          cargo run --locked -p tikzarium-cli -- help ОКРУЖНОСТЬ > /tmp/tikzarium-ci/help-search.txt
          cargo run --locked -p tikzarium-cli -- help tikz.line > /tmp/tikzarium-ci/help-line.txt
          cargo run --locked -p tikzarium-cli -- help tikz.library.positioning > /tmp/tikzarium-ci/help-positioning.txt
          cargo run --locked -p tikzarium-cli -- help 'смещение и якоря' > /tmp/tikzarium-ci/help-description-search.txt
          grep -F 'tikz.library.positioning' /tmp/tikzarium-ci/help-all.txt
          grep -F 'НЕ default TikZ' /tmp/tikzarium-ci/help-tip.txt
          grep -F 'tikz.circle' /tmp/tikzarium-ci/help-search.txt
          grep -F 'Пояснение: Создаёт прямой отрезок' /tmp/tikzarium-ci/help-line.txt
          grep -F 'Пояснение: Позволяет задавать положение узла' /tmp/tikzarium-ci/help-positioning.txt
          grep -F 'tikz.library.positioning' /tmp/tikzarium-ci/help-description-search.txt
          if cargo run --locked -p tikzarium-cli -- help nonexistent-unknown-tool; then exit 1; fi
      - name: Install local TeX + PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-pictures texlive-latex-extra poppler-utils fonts-dejavu-core
      - name: Record environment
        run: |
          xelatex --version | head -n 2
          kpsewhich tikz.sty
          kpsewhich standalone.cls
          pdftoppm -v
      - name: I40 audited Cargo.lock and fail-closed provenance / hosted Linux
        run: |
          python3 -m unittest discover -s scripts/tests -p test_qa_cargo_lock.py -v
          python3 scripts/qa_cargo_lock.py --report /tmp/tikzarium-ci/lock-linux.json
      - name: Offline unit tests for PDF Unicode gate
        run: python3 -m unittest discover -s scripts/tests -p 'test_qa_unicode_pdf.py' -v
      - name: Test CLI build against actual XeLaTeX
        run: |
          cargo run --locked -p tikzarium-cli -- doctor
          mkdir -p /tmp/tikzarium-ci
          sha256sum examples/quickstart.tex examples/cyrillic.tex > /tmp/tikzarium-ci/source-before.sha256
          cargo run --locked -p tikzarium-cli -- build examples/quickstart.tex /tmp/tikzarium-ci/quickstart.pdf
          cargo run --locked -p tikzarium-cli -- build examples/cyrillic.tex /tmp/tikzarium-ci/cyrillic.pdf
          pdfinfo /tmp/tikzarium-ci/quickstart.pdf | grep -E '^Pages: *1$'
          pdfinfo /tmp/tikzarium-ci/cyrillic.pdf | grep -E '^Pages: *1$'
          python3 scripts/qa_unicode_pdf.py /tmp/tikzarium-ci/cyrillic.pdf --expect 'Тест' --expect 'Кириллица.' --expect 'Точка' --extracted-out /tmp/tikzarium-ci/cyrillic-extracted.txt
          sha256sum -c /tmp/tikzarium-ci/source-before.sha256
          {
            rustc -vV
            xelatex --version | head -n 2
            pdftotext -v 2>&1 | head -n 1
            fc-match 'DejaVu Serif'
          } > /tmp/tikzarium-ci/environment.txt
          sha256sum /tmp/tikzarium-ci/quickstart.pdf /tmp/tikzarium-ci/cyrillic.pdf target/debug/tikzarium-cli > /tmp/tikzarium-ci/output.sha256
          pdftoppm -f 1 -singlefile -png -scale-to 1200 \
            /tmp/tikzarium-ci/quickstart.pdf /tmp/tikzarium-ci/preview
          test -s /tmp/tikzarium-ci/preview.png
      - name: B03 actual two-page PDF + Poppler navigation regression
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_qa_multipage_pdf.py' -v
          mkdir -p /tmp/tikzarium-ci/multipage
          python3 scripts/qa_multipage_pdf.py \
            --cli target/debug/tikzarium-cli \
            --source crates/tikzarium-app/fixtures/two_pages.tex \
            --output-dir /tmp/tikzarium-ci/multipage \
            --expect-first 'Привет' \
            --expect-second 'Геометрия'
      - name: C04/C06 extension catalogue audit and 14 tamper tests
        run: |
          python3 -m unittest discover -s extensions/qa -p 'test_verify_catalog.py' -v
          python3 extensions/qa/verify_catalog.py --report /tmp/tikzarium-ci/catalog-audit.json
      - name: Audit XeLaTeX PGF/TikZ extension fixtures with actual artifacts
        run: |
          python3 -m unittest discover -s extensions/qa -p 'test_run_smoke.py' -v
          python3 -m unittest discover -s extensions/qa -p 'test_verify_smoke.py' -v
          python3 extensions/qa/run_smoke.py --output /tmp/tikzarium-ci/extensions-c03
          python3 extensions/qa/verify_smoke.py \
            --output /tmp/tikzarium-ci/extensions-c03 \
            --report /tmp/tikzarium-ci/extensions-c03/audit.json
      - name: Upload smoke PDFs and Unicode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-xelatex-linux-fixtures
          path: /tmp/tikzarium-ci/
          if-no-files-found: warn
