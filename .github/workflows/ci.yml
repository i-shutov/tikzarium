name: TikZarium CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-native:
    name: Rust native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target_name: windows-x64
            executable_suffix: .exe
          - os: macos-15
            target_name: macos-arm64
            executable_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - name: Toolchain and native target
        run: rustc -vV
      - name: Verify physical architecture of hosted runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustc -vV | grep -F 'host: aarch64-apple-darwin'
      - name: I40 audited Cargo.lock and fail-closed provenance / hosted native
        run: |
          python -m unittest discover -s scripts/tests -p test_qa_cargo_lock.py -v
          python scripts/qa_cargo_lock.py --report .qa-artifacts/lock-${{ matrix.target_name }}.json
      - name: Check source formatting
        run: cargo fmt --all -- --check
      - name: Check crates compile
        run: cargo check --locked --workspace --all-targets
      - name: Tests
        run: cargo test --locked --workspace
      - name: I06 source-save integrity (no-op, external change and symlink)
        run: cargo test --locked -p tikzarium-core document::tests -- --nocapture
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Release binary
        run: cargo build --locked --release -p tikzarium-app -p tikzarium-cli
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-windows-server-build
          path: |
            target/release/tikzarium-app.exe
            target/release/tikzarium-cli.exe
            .qa-artifacts/lock-windows-x64.json
          if-no-files-found: error
      - name: Upload macOS ARM64 binaries
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-macos-arm64-build
          path: |
            target/release/tikzarium-app
            target/release/tikzarium-cli
            .qa-artifacts/lock-macos-arm64.json
          if-no-files-found: error

  xelatex-linux-smoke:
    name: XeLaTeX real fixtures / Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Install local TeX + PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-pictures texlive-latex-extra poppler-utils fonts-dejavu-core
      - name: Record environment
        run: |
          xelatex --version | head -n 2
          kpsewhich tikz.sty
          kpsewhich standalone.cls
          pdftoppm -v
      - name: I40 audited Cargo.lock and fail-closed provenance / hosted Linux
        run: |
          python3 -m unittest discover -s scripts/tests -p test_qa_cargo_lock.py -v
          python3 scripts/qa_cargo_lock.py --report /tmp/tikzarium-ci/lock-linux.json
      - name: Offline unit tests for PDF Unicode gate
        run: python3 -m unittest discover -s scripts/tests -p 'test_qa_unicode_pdf.py' -v
      - name: Test CLI build against actual XeLaTeX
        run: |
          cargo run --locked -p tikzarium-cli -- doctor
          mkdir -p /tmp/tikzarium-ci
          sha256sum examples/quickstart.tex examples/cyrillic.tex > /tmp/tikzarium-ci/source-before.sha256
          cargo run --locked -p tikzarium-cli -- build examples/quickstart.tex /tmp/tikzarium-ci/quickstart.pdf
          cargo run --locked -p tikzarium-cli -- build examples/cyrillic.tex /tmp/tikzarium-ci/cyrillic.pdf
          pdfinfo /tmp/tikzarium-ci/quickstart.pdf | grep -E '^Pages: *1$'
          pdfinfo /tmp/tikzarium-ci/cyrillic.pdf | grep -E '^Pages: *1$'
          python3 scripts/qa_unicode_pdf.py /tmp/tikzarium-ci/cyrillic.pdf --expect 'Тест' --expect 'Кириллица.' --expect 'Точка' --extracted-out /tmp/tikzarium-ci/cyrillic-extracted.txt
          sha256sum -c /tmp/tikzarium-ci/source-before.sha256
          {
            rustc -vV
            xelatex --version | head -n 2
            pdftotext -v 2>&1 | head -n 1
            fc-match 'DejaVu Serif'
          } > /tmp/tikzarium-ci/environment.txt
          sha256sum /tmp/tikzarium-ci/quickstart.pdf /tmp/tikzarium-ci/cyrillic.pdf target/debug/tikzarium-cli > /tmp/tikzarium-ci/output.sha256
          pdftoppm -f 1 -singlefile -png -scale-to 1200 \
            /tmp/tikzarium-ci/quickstart.pdf /tmp/tikzarium-ci/preview
          test -s /tmp/tikzarium-ci/preview.png
      - name: B03 actual two-page PDF + Poppler navigation regression
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_qa_multipage_pdf.py' -v
          mkdir -p /tmp/tikzarium-ci/multipage
          python3 scripts/qa_multipage_pdf.py \
            --cli target/debug/tikzarium-cli \
            --source crates/tikzarium-app/fixtures/two_pages.tex \
            --output-dir /tmp/tikzarium-ci/multipage \
            --expect-first 'Привет' \
            --expect-second 'Геометрия'
      - name: C04/C06 extension catalogue audit and 14 tamper tests
        run: |
          python3 -m unittest discover -s extensions/qa -p 'test_verify_catalog.py' -v
          python3 extensions/qa/verify_catalog.py --report /tmp/tikzarium-ci/catalog-audit.json
      - name: Audit XeLaTeX PGF/TikZ extension fixtures with actual artifacts
        run: |
          python3 -m unittest discover -s extensions/qa -p 'test_run_smoke.py' -v
          python3 -m unittest discover -s extensions/qa -p 'test_verify_smoke.py' -v
          python3 extensions/qa/run_smoke.py --output /tmp/tikzarium-ci/extensions-c03
          python3 extensions/qa/verify_smoke.py \
            --output /tmp/tikzarium-ci/extensions-c03 \
            --report /tmp/tikzarium-ci/extensions-c03/audit.json
      - name: Upload smoke PDFs and Unicode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikzarium-xelatex-linux-fixtures
          path: /tmp/tikzarium-ci/
          if-no-files-found: warn
