name: One-time font/theme rustfmt bootstrap
on:
  push:
    branches: ["feat/fontspec-*"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fontspec-glyph-proof-egui-themes
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Apply deterministic rustfmt on feature branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet -- crates/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/
            git commit -m "style: rustfmt figure fonts and theme modules"
            git push origin HEAD:feat/fontspec-glyph-proof-egui-themes
          fi
