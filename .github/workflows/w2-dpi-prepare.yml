name: Prepare exact W2 physical-pixel candidate on disposable branch
on:
  push:
    branches: [release/w2-physical-capture-20261108]
permissions:
  contents: read
jobs:
  prepare-candidate:
    if: contains(github.event.head_commit.message, '[apply-w2-dpi]') && github.repository == 'i-shutov/tikzarium'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply SHA-pinned source patch only inside this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/w2-physical-capture-20261108
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          raw = b''.join(pathlib.Path(f'.github/w2-dpi.part{i}.b64').read_bytes() for i in (1,2))
          packed = base64.b64decode(raw, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '9967d46ced7a90f3f6a84ff56afe12a9fd3092efd8ca5ec916e769b08cae35a7'
          patch = pathlib.Path(os.environ['RUNNER_TEMP'])/'w2-dpi.patch'
          patch.write_bytes(lzma.decompress(packed))
          paths = subprocess.check_output(['git','apply','--numstat',str(patch)], text=True)
          for line in paths.splitlines():
              path = line.split('\t')[-1]
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('scripts/tools/', 'docs/', 'plans/')), path
          subprocess.run(['git','apply','--check',str(patch)], check=True)
          subprocess.run(['git','apply','--index',str(patch)], check=True)
          # Preserve the exact historical status name required by the existing
          # release-document contract; it is explicitly historical, not current.
          doc = pathlib.Path('docs/WINDOWS_1_0_RELEASE_CONTROL_RU.md')
          text = doc.read_text(encoding='utf-8')
          text = text.replace('Старые `NO_FOREGROUND_WINDOW`', 'Старые `BLOCKED_FOREGROUND_NOT_OWNED`, `NO_FOREGROUND_WINDOW`')
          text = text.replace('Фактический статус на основном коммите b761a37f1872d13dd5d866ff2d68ac8b8aa60989', 'Фактический статус (см. точные SHA в свидетельствах)')
          doc.write_text(text, encoding='utf-8')
          subprocess.run(['git','add',str(doc)], check=True)
          PY
      - name: Independent DPI, HWND, source and release negative regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w2-dpi"
          python3 -m unittest discover -s scripts/tools -p 'test_qa_windows*.py' -v 2>&1 | tee "$RUNNER_TEMP/w2-dpi/python-tests.log"
          python3 -m unittest discover -s scripts/tools -p test_release_1_0_docs_and_w2_focus.py -v
          git diff --cached --check
      - name: Commit only reviewed source and fast-forward this branch, never main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/w2-physical-capture-20261108 | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix own-window DPI capture with scoped physical-pixel geometry and negative evidence tests'
          git push origin HEAD:refs/heads/release/w2-physical-capture-20261108
          git rev-parse HEAD > "$RUNNER_TEMP/w2-dpi/SOURCE_SHA.txt"
          git archive --format=zip --output="$RUNNER_TEMP/w2-dpi/tikzarium-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: w2-dpi-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/w2-dpi/
          retention-days: 7
          if-no-files-found: warn
