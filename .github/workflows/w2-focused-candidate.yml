name: W2 focused disposable candidate preparation
on:
  push:
    branches: [release/w2-startup-ready-20261108]
permissions:
  contents: read
jobs:
  prepare-reviewed-candidate:
    if: contains(github.event.head_commit.message, '[apply-w2-candidate]') && github.repository == 'i-shutov/tikzarium'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
          components: rustfmt, clippy
      - name: Apply the exact owner-requested candidate only on its feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/w2-startup-ready-20261108
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          raw = b''.join(pathlib.Path(f'.github/w2-candidate.part{i}.b64').read_bytes() for i in (1,2))
          data = base64.b64decode(raw, validate=True)
          assert hashlib.sha256(data).hexdigest() == '3f14e987109e0553e74d66614631a1f3d3eca04cd21b891847a4d2187c5fcba5'
          patch = pathlib.Path(os.environ['RUNNER_TEMP'])/'w2-candidate.patch'
          patch.write_bytes(lzma.decompress(data))
          paths = subprocess.check_output(['git','apply','--numstat',str(patch)], text=True)
          for line in paths.splitlines():
              path = line.split('\t')[-1]
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              assert path.startswith(('crates/tikzarium-', 'scripts/tools/', 'docs/', 'plans/', '.github/workflows/')) or path == 'CHANGELOG.md', path
          subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)], check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)], check=True)
          PY
      - name: Format and test real Rust candidate before publishing branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w2-prepared"
          cargo fmt --all
          cargo test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/w2-prepared/rust-tests.log"
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/w2-prepared/clippy.log"
          python3 -m unittest discover -s scripts/tools -p 'test_qa_windows*.py' -v 2>&1 | tee "$RUNNER_TEMP/w2-prepared/python-tests.log"
          python3 -m unittest discover -s scripts/tools -p test_release_1_0_docs_and_w2_focus.py -v
      - name: Commit source only and fast-forward this branch; never main or workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/w2-startup-ready-20261108
          git add crates
          git reset -- .github/workflows
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/release/w2-startup-ready-20261108 | cut -f1)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix native startup: asynchronous bounded TeX probes and owned-window activation handshake'
          git push origin HEAD:refs/heads/release/w2-startup-ready-20261108
          git rev-parse HEAD > "$RUNNER_TEMP/w2-prepared/SOURCE_SHA.txt"
          git archive --format=zip --output="$RUNNER_TEMP/w2-prepared/tikzarium-source.zip" HEAD
          sha256sum "$RUNNER_TEMP/w2-prepared/tikzarium-source.zip" > "$RUNNER_TEMP/w2-prepared/MANIFEST.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: w2-prepared-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/w2-prepared/
          retention-days: 7
          if-no-files-found: warn
