name: I05 one-time rustfmt
on:
  push:
    branches:
      - feat/i05-runner-diagnostics-extension-audit
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i05-runner-diagnostics-extension-audit
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Apply reproducible format pass and update feature branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet -- crates/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/
            git commit -m "style(i05): rustfmt integrated core and GUI diagnostics"
            git push origin HEAD:feat/i05-runner-diagnostics-extension-audit
          fi
