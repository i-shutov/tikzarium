# Offline original-evidence adversarial tests. Never physical Windows10 GUI proof.
name: W3 evidence contract (hosted, negative-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tools/qa_w3_physical_evidence.py'
      - 'scripts/tools/test_qa_w3_physical_evidence.py'
      - '.github/workflows/qa-w3-original-evidence.yml'
      - 'plans/2026-11-10_W3_ORIGINAL_EVIDENCE_GATE.md'
  push:
    branches: [main]
    paths:
      - 'scripts/tools/qa_w3_physical_evidence.py'
      - 'scripts/tools/test_qa_w3_physical_evidence.py'
      - '.github/workflows/qa-w3-original-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w3-original-evidence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  adversarial:
    name: Offline fail-closed evidence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Provenance exact source with no source rewrite
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code -- Cargo.lock
      - name: Original-evidence negative matrix with assertions enabled
        run: python -m unittest discover -s scripts/tools -p test_qa_w3_physical_evidence.py -v
      - name: Optimized interpreter must not bypass evidence rejections
        run: python -O -m unittest discover -s scripts/tools -p test_qa_w3_physical_evidence.py -v
      - name: Double-optimized interpreter must not bypass evidence rejections
        run: python -OO -m unittest discover -s scripts/tools -p test_qa_w3_physical_evidence.py -v
      - name: CLI is read-only and advertises required original evidence
        run: python scripts/tools/qa_w3_physical_evidence.py --help
