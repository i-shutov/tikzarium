name: B42 real Studio icon palettes screenshot audit (bootstrap only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/tikzarium-app/**'
      - 'scripts/qa_b42_studio_x11.py'
      - '.github/workflows/b42-studio-x11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
      - name: Install hosted X11 desktop prerequisites (not physical OS)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth openbox xdotool imagemagick libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libudev-dev
      - name: Compile the actual Rust/egui executable from locked sources
        run: |
          cargo build --locked -p tikzarium-app --bin tikzarium-app
          git diff --exit-code -- Cargo.lock
      - name: Capture actual Studio and floating grouped palette from X11
        run: |
          mkdir -p "$RUNNER_TEMP/b42-runtime"
          chmod 700 "$RUNNER_TEMP/b42-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/b42-runtime"
          xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' \
            bash -c 'openbox --sm-disable >/tmp/b42-openbox.log 2>&1 & python3 scripts/qa_b42_studio_x11.py --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" --out "$RUNNER_TEMP/b42-evidence"'
      - name: Upload actual screenshots and explicit NOT_RUN ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b42-real-studio-${{ github.run_id }}
          path: ${{ runner.temp }}/b42-evidence/
          if-no-files-found: warn
