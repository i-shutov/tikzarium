name: Windows Server MiKTeX QA (trusted main + manual; not Win10)

# Never run untrusted pull_request code on this persistent Windows Server.
# Automatic runs originate only from code accepted into main.
on:
  workflow_run:
    workflows: ['TikZarium CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main commit SHA (40 lowercase hex)'
        required: true
        type: string
      source_ci_run_id:
        description: 'Successful trusted-main TikZarium CI run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Only actual trusted-main push and explicitly selected manual main runs share
# the persistent-machine lease. PR CI completions trigger workflow_run too but
# must not occupy/cancel the one pending trusted-main slot before jobs.if.
# GitHub concurrency replaces prior pending runs even with cancel-in-progress=false.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && 'tikzarium-trusted-winserver-main' || format('tikzarium-ignored-workflow-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  user-windows-server:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Windows, X64, tikzarium-winserver]
    timeout-minutes: 55
    steps:
      # On a new Windows Server, Git for Windows can be installed but absent
      # from the PATH inherited by the long-running runner process.
      # Fail with a precise prerequisite diagnosis; never install software here.
      - name: Preflight external Git for Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $candidatePaths = @(
              "$env:ProgramFiles\Git\cmd\git.exe",
              "${env:ProgramFiles(x86)}\Git\cmd\git.exe"
            )
            foreach ($candidate in $candidatePaths) {
              if (-not [string]::IsNullOrWhiteSpace($candidate) -and (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                $dir = Split-Path -Parent $candidate
                $env:PATH = "$dir;$env:PATH"
                $utf8 = [System.Text.UTF8Encoding]::new($false)
                [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n", $utf8)
                $git = Get-Command git.exe -ErrorAction SilentlyContinue
                break
              }
            }
          }
          if (-not $git) {
            throw 'Git for Windows is not installed or visible to runner; install Git for Windows 2.18+ and restart run.cmd. No fallback archive can satisfy exact git SHA gate.'
          }
          & git.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Git for Windows executable failed' }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            Write-Host 'PowerShell 7 (pwsh) is not installed; Windows PowerShell 5.1 is used by this workflow.'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_main_sha }}
          persist-credentials: false
      - name: Validate exact current main and successful hosted push CI
        id: exact_main_sha
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_main_sha }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:SOURCE_RUN_ID -notmatch '^[0-9]+$') {
            throw 'Exact source SHA and decimal source CI run ID are required'
          }
          $actual=(git rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA){throw 'Trusted checkout SHA mismatch'}
          $headers=@{'Authorization'="Bearer $env:GH_TOKEN";'User-Agent'='TikZarium-trusted-main-check';'Accept'='application/vnd.github+json'}
          $branch=Invoke-RestMethod -Uri 'https://api.github.com/repos/i-shutov/tikzarium/branches/main' -Headers $headers
          if($branch.commit.sha -cne $actual){throw 'Main advanced: refusing stale hosted artifact'}
          $ci=Invoke-RestMethod -Uri "https://api.github.com/repos/i-shutov/tikzarium/actions/runs/$env:SOURCE_RUN_ID" -Headers $headers
          if($ci.name -cne 'TikZarium CI' -or $ci.event -cne 'push' -or
             $ci.head_branch -cne 'main' -or $ci.head_sha -cne $actual -or
             $ci.status -cne 'completed' -or $ci.conclusion -cne 'success'){
            throw 'Hosted source CI is not a successful exact-current-main push workflow'
          }
          Write-Host "Trusted source: $actual; reviewed CI: $env:SOURCE_RUN_ID"
      - name: Download original native release EXE from successful main CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tikzarium-windows-server-build
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/tikzarium-hosted/native
      - name: Download original portable ZIP and audit from same main CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tikzarium-windows-x64-portable-candidate
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/tikzarium-hosted/portable
      # Optional separate QA-only artifact from SAME successful reviewed
      # main push CI as verified product EXE. No PR code/payload accepted.
      - name: Download optional original pal1000 W2 QA escrow from same trusted main CI
        id: mesa_escrow_download
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tikzarium-w2-pal1000-qa-escrow
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/tikzarium-hosted/qa-mesa-pal1000
      - name: Verify and smoke original native hosted EXE and ZIP on personal Server (no Cargo/TeX)
        id: hosted_stage
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_main_sha }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_ci_run_id }}
        run: |
          ./scripts/tools/qa_windows_server_stage.ps1 -NativeRoot "$env:RUNNER_TEMP\tikzarium-hosted\native" -PortableRoot "$env:RUNNER_TEMP\tikzarium-hosted\portable" -OutputDir "$env:RUNNER_TEMP\tikzarium-user-miktex" -ExpectedSha $env:EXPECTED_SHA -SourceRunId $env:SOURCE_RUN_ID -VerificationHost personal-server
      - name: Read-only administrator elevation, integrity and UAC linked-token inventory
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' }}
        shell: powershell
        run: |
          $token = & ./scripts/tools/qa_windows_token.ps1
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\tikzarium-user-miktex" | Out-Null
          $token | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$env:RUNNER_TEMP\tikzarium-user-miktex\windows-admin-token.json" -Encoding utf8
      - name: Stage temporary hash-pinned software GL next to reviewed GUI copy (NO INSTALL)
        id: w2_software_gl
        # Test the exact distributed package early; full W1 remains independent below.
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' && steps.hosted_stage.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP ('tikzarium-w2-gl-' + $env:GITHUB_RUN_ID)
          $bin=Join-Path $base 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\tikzarium-user-miktex\hosted-native-verified\tikzarium-app.exe" -Destination (Join-Path $bin 'tikzarium-app.exe') -Force
          $evidence=Join-Path $env:RUNNER_TEMP 'tikzarium-user-miktex'
          try {
            ./scripts/tools/qa_windows_server_mesa_stage.ps1 -AppDirectory $bin -EvidenceDirectory $evidence -ExpectedSha $env:GITHUB_SHA -BinaryOrigin verified-hosted-release
          } catch {
            # continue-on-error protects W1. Persist the actual GL-stage error.
            $blocked=[ordered]@{
              schema_version=1;status='BLOCKED_PINNED_MESA_STAGE_UNAVAILABLE'
              source_sha=$env:GITHUB_SHA;environment='PERSONAL_WINDOWS_SERVER'
              error=$_.Exception.Message;full_w2_qualification='NOT_RUN'
              physical_windows10='NOT_RUN'
            }
            $blocked | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence 'w2-mesa-stage-result.json') -Encoding UTF8
            throw
          }
      - name: Real native interactive GUI / F1 screenshot probe (W2 partial only)
        # Even with software GL, W2 requires a real unlocked existing RDP user
        # desktop, PID-owned HWND, and private client-only original PNGs.
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' && steps.hosted_stage.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          $base=Join-Path $env:RUNNER_TEMP ('tikzarium-w2-gl-' + $env:GITHUB_RUN_ID)
          $bin=Join-Path $base 'bin'
          $staged=Join-Path $bin 'tikzarium-app.exe'
          $evidence=Join-Path $env:RUNNER_TEMP 'tikzarium-user-miktex'
          if((Test-Path -LiteralPath $staged -PathType Leaf) -and
             (Test-Path -LiteralPath (Join-Path $evidence 'w2-mesa-software-gl-provenance.json') -PathType Leaf)){
            ./scripts/tools/qa_windows_server_interactive.ps1 -OutputDir $evidence -ProbeRealW2bStage1 -StagedGuiExe $staged -BinaryOrigin verified-hosted-release
          } else {
            # No tested pinned GL overlay means a precise BLOCKED; never start
            # bare egui_glow/OpenGL on the known non-GL2 Server GPU.
            $reason='Pinned QA Mesa DLLs/provenance not available'
            $evidenceError=Join-Path $evidence 'w2-mesa-stage-result.json'
            if(Test-Path -LiteralPath $evidenceError -PathType Leaf){
              $stage=Get-Content -LiteralPath $evidenceError -Raw -Encoding UTF8 | ConvertFrom-Json
              if($stage.error){$reason=$stage.error}
            }
            $blocked=[ordered]@{
              schema_version=3;status='BLOCKED_PINNED_MESA_STAGE_UNAVAILABLE'
              source_sha=$env:GITHUB_SHA;environment='PERSONAL_WINDOWS_SERVER'
              physical_windows10='NOT_RUN';full_w2_qualification='NOT_RUN'
              gesture_six='NOT_RUN';source_patch='NOT_RUN';save_open='NOT_RUN'
              native_dialogs='NOT_RUN';ime='NOT_RUN';dpi_200='NOT_RUN'
              gui_xelatex_pdf='NOT_RUN';window_screenshot='NOT_RUN';f1='NOT_RUN'
              preflight='NOT_RUN';gl_renderer='NOT_PROVEN_NO_GUI_LAUNCH';error=$reason
              started_at_utc=[DateTime]::UtcNow.ToString('o')
              finished_at_utc=[DateTime]::UtcNow.ToString('o')
            }
            $blocked | ConvertTo-Json -Depth 6 |
              Set-Content -LiteralPath (Join-Path $evidence 'windows-server-w2-interactive.json') -Encoding UTF8
            throw 'BLOCKED_PINNED_MESA_STAGE_UNAVAILABLE: see original JSON and w2-mesa-stage-result.json'
          }
      - name: Remove every temporary Mesa DLL and copied GUI from personal runner
        if: always()
        shell: powershell
        run: |
          if($env:RUNNER_TEMP -and $env:GITHUB_RUN_ID){
            $base=Join-Path $env:RUNNER_TEMP ('tikzarium-w2-gl-' + $env:GITHUB_RUN_ID)
            if(Test-Path -LiteralPath $base){Remove-Item -LiteralPath $base -Recurse -Force}
          }
      - name: Read-only W2 transport and disk diagnostics before artifact upload
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_server_transport_probe.ps1 -OutputDir "$env:RUNNER_TEMP\tikzarium-user-miktex" -Stage after-w2
      - name: Upload original W2 result before independent server rebuild
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tikzarium-w2-early-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tikzarium-user-miktex/windows-server-w2-interactive.json
            ${{ runner.temp }}/tikzarium-user-miktex/windows-server-hosted-artifact.json
            ${{ runner.temp }}/tikzarium-user-miktex/w2-mesa-software-gl-provenance.json
            ${{ runner.temp }}/tikzarium-user-miktex/w2-mesa-stage-result.json
            ${{ runner.temp }}/tikzarium-user-miktex/windows-admin-token.json
            ${{ runner.temp }}/tikzarium-user-miktex/w2-interactive/
          if-no-files-found: warn
      - name: Dedicated Windows Server Rust tests, PE validation, portable build
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' }}
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_server_rust.ps1 -OutputDir "$env:RUNNER_TEMP\tikzarium-user-miktex"
      - name: Existing external MiKTeX offline proof (independent of Rust result)
        # A failed Rust compile must not conceal a separate MiKTeX diagnostic;
        # NEVER run this step unless exact trusted-main checkout succeeded.
        if: ${{ !cancelled() && steps.exact_main_sha.outcome == 'success' }}
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_server_user.ps1 -OutputDir "$env:RUNNER_TEMP\tikzarium-user-miktex"
      - name: Read-only post-W1 transport diagnostic even after failure
        if: ${{ always() && steps.exact_main_sha.outcome == 'success' }}
        continue-on-error: true
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_server_transport_probe.ps1 -OutputDir "$env:RUNNER_TEMP\tikzarium-user-miktex" -Stage after-w1
      - name: Upload honest evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tikzarium-user-winserver-${{ github.run_id }}
          path: ${{ runner.temp }}/tikzarium-user-miktex/
          if-no-files-found: warn
