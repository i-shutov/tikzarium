name: I51 B36 real X11 dirty-Open preserve user TeX and PDF
on:
  push:
    branches:
      - qa/i51-b36-real-x11-pdf-focus
      - qa/i46-b34-dirty-open-real-x11
      - b/b32-safe-open-source-undo-20261101
      - b/b36-compact-pdf-focus
      - main
    paths:
      - '.github/workflows/i46-b34-dirty-open-x11.yml'
      - 'scripts/qa_i46_dirty_open_x11.py'
      - 'scripts/tests/test_qa_i46_dirty_open_x11.py'
      - 'fixtures/qa/i46-b34-dirty-open-x11-1366.json'
      - 'crates/tikzarium-app/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'plans/2026-11-01_I46_B35_DIRTY_OPEN_REAL_X11.md'
      - 'insights/2026-11-01_I46_B35_REAL_OPEN_QA.md'
      - 'plans/2026-11-01_I51_B36_LIVE_PDF_FOCUS.md'
      - 'insights/2026-11-01_I51_B36_LIVE_DESKTOP_QA.md'
      - 'CHANGELOG.md'
  pull_request:
    branches:
      - b/b32-safe-open-source-undo-20261101
      - b/b36-compact-pdf-focus
      - main
    paths:
      - '.github/workflows/i46-b34-dirty-open-x11.yml'
      - 'scripts/qa_i46_dirty_open_x11.py'
      - 'scripts/tests/test_qa_i46_dirty_open_x11.py'
      - 'fixtures/qa/i46-b34-dirty-open-x11-1366.json'
      - 'crates/tikzarium-app/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'plans/2026-11-01_I46_B35_DIRTY_OPEN_REAL_X11.md'
      - 'insights/2026-11-01_I46_B35_REAL_OPEN_QA.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i46-b34-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  actual-b36-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TIKZARIUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TIKZARIUM_QA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TIKZARIUM_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
      - name: Verify exact checkout and B36 app source tree; never accept stale B31 X11
        run: |
          test "$(git rev-parse HEAD)" = "$TIKZARIUM_SOURCE_SHA"
          echo "TIKZARIUM_APP_TREE_SHA=$(git rev-parse HEAD:crates/tikzarium-app/src)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD:crates/tikzarium-app/src)" = '276ad1525db4ef3d3aab4624808453a897ad5b6a'
      - name: Install external Linux X11, XeLaTeX and PDF prerequisites
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth openbox xdotool xclip imagemagick libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev \
            texlive-xetex texlive-latex-extra texlive-pictures poppler-utils fonts-dejavu-core
          xelatex --version | head -1
      - name: I46 offline predicates (not accepted as actual GUI)
        run: python3 -m unittest discover -s scripts/tests -p test_qa_i46_dirty_open_x11.py -v
      - name: Build unmodified B36 egui executable with checked Cargo.lock
        run: |
          cargo build --locked -p tikzarium-app --bin tikzarium-app
          git diff --exit-code -- Cargo.lock
      - name: Actual egui window, modal clicks, victim hash, source Undo and PDF
        run: |
          mkdir -p "$RUNNER_TEMP/i46-runtime"
          chmod 700 "$RUNNER_TEMP/i46-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/i46-runtime"
          xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' \
            bash -c 'openbox --sm-disable >/tmp/i46-openbox.log 2>&1 & python3 scripts/qa_i46_dirty_open_x11.py --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" --out "$RUNNER_TEMP/i46-evidence" --profile fixtures/qa/i46-b34-dirty-open-x11-1366.json'
      - name: Preserve failed and successful real evidence for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i46-b34-dirty-open-${{ env.TIKZARIUM_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/i46-evidence/*.png
            ${{ runner.temp }}/i46-evidence/*.tex
            ${{ runner.temp }}/i46-evidence/*.pdf
            ${{ runner.temp }}/i46-evidence/*.json
            ${{ runner.temp }}/i46-evidence/*.txt
            ${{ runner.temp }}/i46-evidence/*.log
          if-no-files-found: warn
