name: I57 N2 four actual X11 library source PDF Undo Open and C help
on:
  pull_request:
    branches: [main, b40-egui-source-undo-transaction-fence, b41-egui-pinned-parameter-apply]
    paths:
      - '.github/workflows/i57-n2-four-live-x11.yml'
      - 'scripts/qa_i57_four_libs_x11.py'
      - 'scripts/qa_i53_live_libraries_x11.py'
      - 'scripts/tests/test_qa_i57_four_libs.py'
      - 'fixtures/qa/i57-four-library-targets.json'
      - 'fixtures/qa/i53-b38-live-libraries-1366.json'
      - 'crates/**'
      - 'Cargo.lock'
  push:
    branches: [main, qa/i58-b40-source-history-x11, qa/i60-b41-inspector-real-x11, b41-egui-pinned-parameter-apply]
    paths:
      - '.github/workflows/i57-n2-four-live-x11.yml'
      - 'scripts/qa_i57_four_libs_x11.py'
      - 'scripts/qa_i53_live_libraries_x11.py'
      - 'scripts/tests/test_qa_i57_four_libs.py'
      - 'fixtures/qa/i57-four-library-targets.json'
      - 'fixtures/qa/i53-b38-live-libraries-1366.json'
      - 'crates/**'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i57-n2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  real-egui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TIKZARIUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
      - name: Verify exact B41 app tree and independent I58 X11 provenance
        run: |
          test "$(git rev-parse HEAD)" = "$TIKZARIUM_SOURCE_SHA"
          test "$(git rev-parse HEAD:crates/tikzarium-app/src)" = '5fa3b794c4711cd32c1b0f68a0ea00c7bf38657a'
          echo "TIKZARIUM_APP_TREE_SHA=$(git rev-parse HEAD:crates/tikzarium-app/src)" >> "$GITHUB_ENV"
      - name: External Linux/X11 and TeX Live prerequisites (not Windows MiKTeX)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth openbox xdotool xclip imagemagick libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev \
            texlive-xetex texlive-latex-extra texlive-pictures poppler-utils fonts-dejavu-core
          xelatex --version | head -1
      - name: Matrix fail-closed negative checks (NOT a GUI proof)
        run: python3 -m unittest discover -s scripts/tests -p test_qa_i57_four_libs.py -v
      - name: Build exact native egui binary and keep Cargo.lock unchanged
        run: |
          cargo build --locked -p tikzarium-app --bin tikzarium-app
          git diff --exit-code -- Cargo.lock
      - name: Four genuine source editor GUI sessions, XeLaTeX, undo and two-file reopen
        run: |
          mkdir -p "$RUNNER_TEMP/i57-runtime"
          chmod 700 "$RUNNER_TEMP/i57-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/i57-runtime"
          xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' \
            bash -c 'openbox --sm-disable >/tmp/i57-openbox.log 2>&1 & python3 scripts/qa_i57_four_libs_x11.py --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" --out "$RUNNER_TEMP/i57-evidence" --base-profile fixtures/qa/i53-b38-live-libraries-1366.json --matrix fixtures/qa/i57-four-library-targets.json'
      - name: Preserve full actual screenshots/sources/PDF and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i57-four-real-x11-${{ github.event.pull_request.head.sha || github.sha }}
          path: /home/runner/work/_temp/i57-evidence/
          if-no-files-found: warn
