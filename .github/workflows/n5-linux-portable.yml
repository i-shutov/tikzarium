# Linux-first N5 portable candidate. Distinct from physical desktop acceptance.
# PR jobs run ONLY on disposable GitHub-hosted Ubuntu, never on self-hosted Windows.
name: N5 Linux x86_64 portable release and packaged X11 launch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/n5-linux-portable.yml'
      - 'scripts/package_n5_preview.py'
      - 'scripts/package_linux_release_candidate.py'
      - 'scripts/tests/test_linux_release_candidate.py'
      - 'scripts/tests/test_package_n5_preview.py'
      - 'scripts/qa_i61_b42_studio_x11.py'
      - 'scripts/qa_n2_studio_x11.py'
      - 'scripts/qa_r1_dirty_close_x11.py'
      - 'scripts/qa_r3_native_picker_x11.py'
      - 'scripts/qa_n5_viewport.py'
      - 'scripts/tests/test_qa_compact*.py'
      - 'scripts/tests/test_qa_n5_viewport.py'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/n5-linux-portable.yml'
      - 'scripts/package_n5_preview.py'
      - 'scripts/package_linux_release_candidate.py'
      - 'scripts/tests/test_linux_release_candidate.py'
      - 'scripts/tests/test_package_n5_preview.py'
      - 'scripts/qa_i61_b42_studio_x11.py'
      - 'scripts/qa_n2_studio_x11.py'
      - 'scripts/qa_r1_dirty_close_x11.py'
      - 'scripts/qa_r3_native_picker_x11.py'
      - 'scripts/qa_n5_viewport.py'
      - 'scripts/tests/test_qa_compact*.py'
      - 'scripts/tests/test_qa_n5_viewport.py'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n5-linux-portable-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  linux-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-head provenance and no Cargo.lock drift
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code -- Cargo.lock
          uname -a
      - name: Fail-closed reviewed Studio source-tree lease for packaged proof
        shell: bash
        run: |
          app_tree="$(git rev-parse HEAD:crates/tikzarium-app/src)"
          grep -Fqx "APP_TREE = \"$app_tree\"" scripts/qa_i61_b42_studio_x11.py
          echo "TIKZARIUM_APP_TREE_SHA=$app_tree" >> "$GITHUB_ENV"
          echo "TIKZARIUM_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Locked Rust 1.91.0 toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
      - name: Restore locked release dependencies and build products
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-n5-compact-release191-${{ hashFiles('Cargo.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-n5-compact-release191-${{ hashFiles('Cargo.lock') }}-
      - name: Install host GUI development/runtime prerequisites (not TeX)
        shell: bash
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends \
            xvfb xauth x11-utils openbox xdotool xclip wmctrl imagemagick python3-pil libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libudev-dev \
            xdg-desktop-portal xdg-desktop-portal-gtk dbus-x11 libglib2.0-bin
      - name: Run offline packaging and ELF architecture/manifest/reproducibility tests
        run: python3 -m unittest discover -s scripts/tests -p test_package_n5_preview.py -v
      - name: R5 versioned release-candidate packaging regressions (offline only)
        run: python3 -m unittest discover -s scripts/tests -p test_linux_release_candidate.py -v
      - name: Compact input and viewport provenance contracts (not native acceptance)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_qa_compact*.py' -v
          python3 -m unittest discover -s scripts/tests -p test_qa_n5_viewport.py -v
      - name: Native release binaries from exact HEAD (no compiler substitution)
        id: production-build
        shell: bash
        run: |
          rustc -vV
          cargo build --locked --release -p tikzarium-app -p tikzarium-cli
          test -z "$(git status --porcelain -- crates extensions Cargo.toml Cargo.lock)"
          file target/release/tikzarium-app target/release/tikzarium-cli
          mkdir -p "$RUNNER_TEMP/n5-linux"
          { git rev-parse HEAD HEAD:crates/tikzarium-app/src; rustc -vV; sha256sum target/release/tikzarium-app target/release/tikzarium-cli Cargo.lock; } > "$RUNNER_TEMP/n5-linux/build-provenance.txt"
      - name: Save verified native release build before GUI assertions
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Package reproducible native Linux x86_64 tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n5-linux"
          python3 scripts/package_n5_preview.py \
            --platform linux-x86_64 \
            --app target/release/tikzarium-app \
            --cli target/release/tikzarium-cli \
            --app-sha256 "$(sha256sum target/release/tikzarium-app | cut -d' ' -f1)" \
            --cli-sha256 "$(sha256sum target/release/tikzarium-cli | cut -d' ' -f1)" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-url "https://github.com/i-shutov/tikzarium/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/n5-linux/Tikzarium-linux-x86_64-preview.tar.gz"
          cd "$RUNNER_TEMP/n5-linux"
          sha256sum Tikzarium-linux-x86_64-preview.tar.gz > archive.sha256
          mkdir extracted
          tar -xzf Tikzarium-linux-x86_64-preview.tar.gz -C extracted
          cd extracted/Tikzarium-preview
          sha256sum -c MANIFEST.sha256
          test -x ./tikzarium-app && test -x ./tikzarium-cli && test -x ./launch.sh
          ./tikzarium-cli help tikz.line > "$RUNNER_TEMP/n5-linux/cli-help.txt"
          grep -F 'tikz.line' "$RUNNER_TEMP/n5-linux/cli-help.txt"
      - name: Real extracted release GUI X11 launch and 1366x768 screenshot
        id: startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n5-runtime"
          chmod 700 "$RUNNER_TEMP/n5-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/n5-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/n5-startup-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/n5-startup-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/n5-startup-cache"
          export LIBGL_ALWAYS_SOFTWARE=1
          export EVIDENCE="$RUNNER_TEMP/n5-linux"
          xvfb-run -a -e "$EVIDENCE/xvfb-errors.log" -s '-screen 0 1366x768x24 +extension GLX +render -noreset' bash -euo pipefail -c '
            openbox --sm-disable > "$EVIDENCE/openbox.log" 2>&1 &
            wm_pid=$!
            # The window manager and the GUI were previously started at once.
            # Do not mistake a transient unmapped X11 window for a product failure.
            for i in $(seq 1 12); do
              if wmctrl -m > "$EVIDENCE/wm-status.txt" 2>&1 && grep -q "^Name: Openbox" "$EVIDENCE/wm-status.txt"; then break; fi
              sleep 1
            done
            grep -q "^Name: Openbox" "$EVIDENCE/wm-status.txt" || {
              echo "N5: Openbox did not become ready before app launch" >&2
              exit 1
            }
            cd "$EVIDENCE/extracted/Tikzarium-preview"
            ./launch.sh > "$EVIDENCE/native-launch.log" 2>&1 &
            app_pid=$!
            trap "kill $app_pid $wm_pid 2>/dev/null || true" EXIT
            : > "$EVIDENCE/visible-window.txt"
            : > "$EVIDENCE/window-probe-status.txt"
            for i in $(seq 1 30); do
              # Preserve independent X11/WM/process facts even on failure.
              wmctrl -lG > "$EVIDENCE/wmctrl-windows.txt" 2>&1 || true
              if command -v xwininfo >/dev/null 2>&1; then
                xwininfo -root -tree > "$EVIDENCE/x11-window-tree.txt" 2>&1 || true
              else
                echo "xwininfo not installed" > "$EVIDENCE/x11-window-tree.txt"
              fi
              ps -o pid,ppid,stat,etime,%cpu,%mem,cmd -p "$app_pid" > "$EVIDENCE/app-process.txt" 2>&1 || true
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "N5: packaged release app exited before window appeared at probe $i" >&2
                cat "$EVIDENCE/app-process.txt" >&2 || true
                exit 1
              fi
              xdotool search --onlyvisible --pid "$app_pid" --name "TikZarium" > "$EVIDENCE/visible-window.txt" 2>/dev/null || true
              if test -s "$EVIDENCE/visible-window.txt"; then
                echo "VISIBLE_WINDOW_PROBE=$i" > "$EVIDENCE/window-probe-status.txt"
                break
              fi
              sleep 1
            done
            if ! test -s "$EVIDENCE/visible-window.txt"; then
              echo "N5: app still alive but no verified visible X11 window after 30 probes" >&2
              cat "$EVIDENCE/app-process.txt" "$EVIDENCE/wm-status.txt" >&2 || true
              tail -n 30 "$EVIDENCE/x11-window-tree.txt" >&2 || true
              exit 1
            fi
            window_id="$(head -n1 "$EVIDENCE/visible-window.txt")"
            # xdotool double-counts Openbox decorations on this environment.
            # Require the actual absolute client geometry, PID and live ELF.
            python3 "$GITHUB_WORKSPACE/scripts/qa_n5_viewport.py" \
              --window "$window_id" --pid "$app_pid" \
              --executable "$EVIDENCE/extracted/Tikzarium-preview/tikzarium-app" \
              --screen-width 1366 --screen-height 768 --min-height 560 \
              --out "$EVIDENCE/window-geometry.json"
            sleep 2
            import -window root "$EVIDENCE/linux-n5-packaged-1366x768.png"
            test -s "$EVIDENCE/linux-n5-packaged-1366x768.png"
            identify -format "%wx%h\n" "$EVIDENCE/linux-n5-packaged-1366x768.png" | tee "$EVIDENCE/png-size.txt"
            grep -Fx "1366x768" "$EVIDENCE/png-size.txt"
          '
          (
            cd "$RUNNER_TEMP/n5-linux"
            sha256sum linux-n5-packaged-1366x768.png native-launch.log archive.sha256 > native-evidence.sha256
          )
      - name: R2 three-scale actual extracted X11 desktop geometry and PNG
        id: r2
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export N5_LAUNCHER="$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/launch.sh"
          export EVIDENCE="$RUNNER_TEMP/n5-linux/r2-desktop"
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$EVIDENCE"
          for spec in "1366x768:1.0" "1920x1080:1.25" "1920x1080:2.0"; do
            screen="${spec%%:*}"
            scale="${spec##*:}"
            name="${screen}-scale-${scale//./_}"
            export R2_DIR="$EVIDENCE/$name"
            export R2_WIDTH="${screen%x*}" R2_HEIGHT="${screen#*x}"
            export WINIT_X11_SCALE_FACTOR="$scale"
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/n5-r2-runtime-$name"
            export XDG_CONFIG_HOME="$R2_DIR/config"
            export XDG_DATA_HOME="$R2_DIR/data"
            export XDG_CACHE_HOME="$R2_DIR/cache"
            mkdir -p "$R2_DIR" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            xvfb-run -a -s "-screen 0 ${screen}x24 +extension GLX +render -noreset" bash -euo pipefail -c '
              openbox --sm-disable >"$R2_DIR/openbox.log" 2>&1 &
              wm_pid=$!
              for i in $(seq 1 12); do
                if wmctrl -m > "$R2_DIR/wm-status.txt" 2>&1 && grep -q "^Name: Openbox" "$R2_DIR/wm-status.txt"; then break; fi
                sleep 1
              done
              grep -q "^Name: Openbox" "$R2_DIR/wm-status.txt"
              "$N5_LAUNCHER" >"$R2_DIR/app.log" 2>&1 &
              app_pid=$!
              trap "kill $app_pid $wm_pid 2>/dev/null || true" EXIT
              window_id=""
              for i in $(seq 1 30); do
                kill -0 "$app_pid" || { echo "App exited before X11 viewport" >&2; exit 1; }
                window_id="$(xdotool search --onlyvisible --pid "$app_pid" --name TikZarium 2>/dev/null | head -n1 || true)"
                test -z "$window_id" || break
                sleep 1
              done
              test -n "$window_id"
              sleep 3
              python3 "$GITHUB_WORKSPACE/scripts/qa_n5_viewport.py" \
                --window "$window_id" --pid "$app_pid" \
                --executable "$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/tikzarium-app" \
                --screen-width "$R2_WIDTH" --screen-height "$R2_HEIGHT" --min-height 440 \
                --out "$R2_DIR/geometry.json"
              import -window root "$R2_DIR/desktop.png"
              identify -format "%wx%h\n" "$R2_DIR/desktop.png" >"$R2_DIR/png-size.txt"
              test "$(cat "$R2_DIR/png-size.txt")" = "${R2_WIDTH}x${R2_HEIGHT}"
            '
          done
          (cd "$EVIDENCE" && find . -type f \( -name 'desktop.png' -o -name 'geometry.json' -o -name '*.original.txt' \) | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done >SHA256SUMS)

      - name: Install external XeLaTeX only on disposable hosted Ubuntu
        id: external-tex
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends \
            xclip texlive-xetex texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils fonts-dejavu-core fonts-sil-charis
          xelatex --version | head -n 2
          command -v pdffonts
      - name: Real extracted portable launcher six-tool/N2/N3/F1/Undo/Save/Open/XeLaTeX
        id: full-vertical
        if: always() && steps.package.outcome == 'success' && steps.external-tex.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export N5_LAUNCHER="$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/launch.sh"
          test -x "$N5_LAUNCHER"
          test -x "$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/tikzarium-app"
          test "$(git rev-parse HEAD:crates/tikzarium-app/src)" = "$TIKZARIUM_APP_TREE_SHA"
          mkdir -p "$RUNNER_TEMP/n5-full-runtime"
          chmod 700 "$RUNNER_TEMP/n5-full-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/n5-full-runtime"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1366x768x24 +extension GLX +render -noreset' \
            bash -euo pipefail -c '
              openbox --sm-disable >"$RUNNER_TEMP/n5-linux/openbox-full.log" 2>&1 &
              # Collect both independent scenarios even on calibration failure.
              # Any failure remains a nonzero step/job, never partial PASS.
              result=0
              python3 scripts/qa_i61_b42_studio_x11.py \
                --app "$N5_LAUNCHER" --out "$RUNNER_TEMP/n5-linux/packaged-i61" || result=1
              python3 scripts/qa_n2_studio_x11.py \
                --app "$N5_LAUNCHER" --out "$RUNNER_TEMP/n5-linux/packaged-n2" || result=1
              exit "$result"
            '
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "n5-linux"
          bundle = evidence / "extracted" / "Tikzarium-preview"
          elf_hash = hashlib.sha256((bundle / "tikzarium-app").read_bytes()).hexdigest()
          launcher_hash = hashlib.sha256((bundle / "launch.sh").read_bytes()).hexdigest()
          assert f"{elf_hash}  tikzarium-app\n" in (bundle / "MANIFEST.sha256").read_text()
          verified = {}
          for name in ("packaged-i61", "packaged-n2"):
              report = json.loads((evidence / name / "report.json").read_text())
              assert report["status"].startswith("PASS_AUTOMATED"), (name, report)
              assert report["source_head_sha"] == os.environ["SOURCE_SHA"]
              assert report["app_tree_sha"] == os.environ["TIKZARIUM_APP_TREE_SHA"]
              # GUI script receives the real launch.sh; manifest locks actual ELF.
              assert report["app_sha256"] == launcher_hash
              observed_elf = report["running_executable_sha256"] if name == "packaged-i61" else report["observed_proc_exe_sha256"]
              assert observed_elf == elf_hash, (name, "running PID is not manifest-locked ELF")
              verified[name] = report
          assert verified["packaged-i61"]["six_real_tools"].startswith("PASS_")
          assert verified["packaged-i61"]["real_xelatex_pdf"].startswith("PASS_")
          assert verified["packaged-i61"]["gui_open_reopen"].startswith("PASS_")
          assert verified["packaged-n2"]["n3_caret_complete"].startswith("PASS_")
          assert verified["packaged-n2"]["n3_xelatex_pdf"].startswith("PASS_")
          assert verified["packaged-n2"]["gui_save_open"].startswith("PASS_")
          proof = {
              "status": "PASS_HOSTED_X11_AUTOMATED_MANUAL_REVIEW_REQUIRED",
              "source_head_sha": os.environ["SOURCE_SHA"],
              "app_elf_sha256": elf_hash, "launcher_sha256": launcher_hash,
              "i61": verified["packaged-i61"]["status"],
              "n2_n3": verified["packaged-n2"]["status"],
              "physical_linux": "NOT_RUN", "hidpi_native_dialogs": "NOT_RUN",
              "wayland": "NOT_RUN",
          }
          (evidence / "packaged-full-proof.json").write_text(
              json.dumps(proof, indent=2) + "\n")
          print(json.dumps(proof))
          PY
      - name: R1 real packaged GUI WM close preserves dirty source and Cancel
        id: r1
        if: always() && steps.package.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export N5_LAUNCHER="$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/launch.sh"
          mkdir -p "$RUNNER_TEMP/n5-close-runtime"
          chmod 700 "$RUNNER_TEMP/n5-close-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/n5-close-runtime"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1366x768x24 +extension GLX +render -noreset' \
            bash -euo pipefail -c '
              openbox --sm-disable > "$RUNNER_TEMP/n5-linux/openbox-close.log" 2>&1 &
              python3 scripts/qa_r1_dirty_close_x11.py \
                --app "$N5_LAUNCHER" --out "$RUNNER_TEMP/n5-linux/packaged-r1-close"
            '
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "n5-linux/packaged-r1-close/report.json").read_text())
          assert report["status"] == "PASS_HOSTED_X11_MANUAL_REVIEW_REQUIRED", report
          assert report["source_sha"] == os.environ["SOURCE_SHA"]
          assert report["app_tree_sha"] == os.environ["TIKZARIUM_APP_TREE_SHA"]
          assert len(report["steps"]) == 5, report
          import hashlib
          bundle = Path(os.environ["RUNNER_TEMP"]) / "n5-linux/extracted/Tikzarium-preview"
          assert report["observed_proc_exe_sha256"] == hashlib.sha256((bundle / "tikzarium-app").read_bytes()).hexdigest()
          PY
      - name: R3 real XDG/GTK native file picker on extracted release (not physical Linux)
        id: r3
        if: always() && steps.package.outcome == 'success' && steps.external-tex.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export N5_LAUNCHER="$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/launch.sh"
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_CURRENT_DESKTOP=GNOME
          export GDK_BACKEND=x11
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/n5-r3-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/n5-r3-config"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/xdg-desktop-portal"
          chmod 700 "$XDG_RUNTIME_DIR"
          printf '[preferred]\ndefault=gtk\norg.freedesktop.impl.portal.FileChooser=gtk\n' \
            >"$XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf"
          export R3_EVIDENCE="$RUNNER_TEMP/n5-linux/packaged-r3-native"
          xvfb-run -a -s '-screen 0 1366x768x24 +extension GLX +render -noreset' \
            dbus-run-session -- bash -euo pipefail -c '
              openbox --sm-disable >"$RUNNER_TEMP/n5-linux/openbox-r3.log" 2>&1 &
              python3 scripts/qa_r3_native_picker_x11.py \
                --app "$N5_LAUNCHER" --out "$R3_EVIDENCE"
            '
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads((Path(os.environ["R3_EVIDENCE"]) / "report.json").read_text())
          assert proof["source_sha"] == os.environ["SOURCE_SHA"], proof
          assert proof["app_tree_sha"] == os.environ["TIKZARIUM_APP_TREE_SHA"], proof
          assert proof["status"] == "PASS_HOSTED_NATIVE_GTK_PORTAL_ORIGINAL_GUI_REVIEW_REQUIRED", proof
          assert proof["steps"] == [
              "genuine_portal_open_window_visible",
              "native_open_selected_unicode_CRLF_source",
              "portal_cancel_keeps_editable_source",
              "native_save_unicode_new_file_no_overwrite",
              "native_export_exact_xelatex_pdf_unicode_embedded_fonts",
          ], proof
          # The real native Export path must include verified, nonempty PDF evidence.
          assert len(proof.get("native_pdf_sha256", "")) == 64, proof
          import hashlib
          bundle = Path(os.environ["RUNNER_TEMP"]) / "n5-linux/extracted/Tikzarium-preview"
          assert proof["observed_proc_exe_sha256"] == hashlib.sha256((bundle / "tikzarium-app").read_bytes()).hexdigest()
          PY
      - name: R5 assemble reproducible Linux 1.0 RC from the exact GUI-tested binaries
        id: r5
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/n5-linux"
          # R1/R2/R3 + six-tools/F1/libraries/XeLaTeX completed above using
          # the same native ELF. This RC only relabels and documents that ELF.
          python3 "$GITHUB_WORKSPACE/scripts/package_linux_release_candidate.py" \
            --app "$GITHUB_WORKSPACE/target/release/tikzarium-app" \
            --cli "$GITHUB_WORKSPACE/target/release/tikzarium-cli" \
            --app-sha256 "$(sha256sum "$GITHUB_WORKSPACE/target/release/tikzarium-app" | cut -d' ' -f1)" \
            --cli-sha256 "$(sha256sum "$GITHUB_WORKSPACE/target/release/tikzarium-cli" | cut -d' ' -f1)" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-url "https://github.com/i-shutov/tikzarium/actions/runs/$GITHUB_RUN_ID" \
            --output Tikzarium-linux-x86_64-1.0.0-rc.1.tar.gz
          sha256sum Tikzarium-linux-x86_64-1.0.0-rc.1.tar.gz > rc-archive.sha256
          mkdir -p rc-extracted
          tar -xzf Tikzarium-linux-x86_64-1.0.0-rc.1.tar.gz -C rc-extracted
          (
            cd rc-extracted/Tikzarium-1.0.0-rc.1
            sha256sum -c MANIFEST.sha256
            cmp -s tikzarium-app "$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/tikzarium-app"
            cmp -s tikzarium-cli "$RUNNER_TEMP/n5-linux/extracted/Tikzarium-preview/tikzarium-cli"
            test -x ./launch.sh
          )
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "n5-linux"
          candidate = root / "rc-extracted/Tikzarium-1.0.0-rc.1"
          p = json.loads((candidate / "PROVENANCE.json").read_text())
          assert p["version"] == "1.0.0-rc.1"
          assert p["source_sha"] == os.environ["SOURCE_SHA"]
          assert p["release_stage"] == "CANDIDATE_NOT_FINAL"
          assert p["release_go"] is False
          assert p["scientific_studio_scope"] == "NOT_ACCEPTED"
          assert p["historical_rc_label"] is True
          assert p["physical_linux_x86_64_x11"] == "NOT_RUN"
          for name, key in [("tikzarium-app","app_sha256"),("tikzarium-cli","cli_sha256")]:
              assert hashlib.sha256((candidate / name).read_bytes()).hexdigest() == p[key]
          (root / "rc-attestation.json").write_text(
              json.dumps({"status":"PASS_RC_PACKAGE_HOSTED_NOT_PHYSICAL",
                "source_sha":p["source_sha"],"version":p["version"],
                "binary_sha256":p["app_sha256"],
                "release_go":False,"scientific_studio_scope":"NOT_ACCEPTED",
                "physical_linux":"NOT_RUN"}, sort_keys=True,indent=2) + "\n")
          PY
          # Actual release binaries, not only synthetic headers, reproduce exactly.
          python3 "$GITHUB_WORKSPACE/scripts/package_linux_release_candidate.py" \
            --app "$GITHUB_WORKSPACE/target/release/tikzarium-app" \
            --cli "$GITHUB_WORKSPACE/target/release/tikzarium-cli" \
            --app-sha256 "$(sha256sum "$GITHUB_WORKSPACE/target/release/tikzarium-app" | cut -d' ' -f1)" \
            --cli-sha256 "$(sha256sum "$GITHUB_WORKSPACE/target/release/tikzarium-cli" | cut -d' ' -f1)" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-url "https://github.com/i-shutov/tikzarium/actions/runs/$GITHUB_RUN_ID" \
            --output rc-second.tar.gz
          cmp -s Tikzarium-linux-x86_64-1.0.0-rc.1.tar.gz rc-second.tar.gz
          rm -f rc-second.tar.gz
