name: PGFPlots originals, attributed derivatives and AT4 native verticals (hosted X11)

# Synthetic 18-property matrix, named SC3-04 SV cases and external table/error
# bars compatibility and the bounded SV-040 native TikZ samples edit. Full SC3/AT4 and physical
# Windows/macOS acceptance remain separate; originals require visual review.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pgfplots-native.yml'
      - 'scripts/qa_pgfplots_vertical*'
      - 'scripts/qa_pgfplots_clean*'
      - 'scripts/tests/test_qa_pgfplots_clean*'
      - 'scripts/qa_at4_*'
      - 'scripts/qa_native_plot_*'
      - 'scripts/visual_guide/**'
      - 'scripts/qa_visual_guide_*'
      - 'roadmap/AI_TIKZ_SKILLS_2026-11-10/**'
      - 'scripts/fixtures/pgfplots-v2/**'
      - 'scripts/qa_sci_compact*'
      - 'scripts/qa_n2_studio_x11.py'
      - 'roadmap/Tikzarium_Scientific_142_R4/fixtures/SR/SV-*/**'
      - 'scripts/qa_i61_b42_studio_x11.py'
      - 'crates/**'
      - 'extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pgfplots-native.yml'
      - 'scripts/qa_pgfplots_vertical*'
      - 'scripts/qa_pgfplots_clean*'
      - 'scripts/tests/test_qa_pgfplots_clean*'
      - 'scripts/qa_at4_*'
      - 'scripts/qa_native_plot_*'
      - 'scripts/visual_guide/**'
      - 'scripts/qa_visual_guide_*'
      - 'roadmap/AI_TIKZ_SKILLS_2026-11-10/**'
      - 'scripts/fixtures/pgfplots-v2/**'
      - 'scripts/qa_sci_compact*'
      - 'scripts/qa_n2_studio_x11.py'
      - 'roadmap/Tikzarium_Scientific_142_R4/fixtures/SR/SV-*/**'
      - 'scripts/qa_i61_b42_studio_x11.py'
      - 'crates/**'
      - 'extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgfplots-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pgfplots-bounded-hosted-gui:
    name: PGFPlots native ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [v2, v2-clean, at4]
    env:
      TIKZARIUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      LIBGL_ALWAYS_SOFTWARE: '1'
      TIKZARIUM_PGF_SUITE: ${{ matrix.suite }}
    steps:
      - name: Check out exact review source, never the synthetic merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout and record current source-tree lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TIKZARIUM_SOURCE_SHA"
          test -z "$(git status --porcelain -- crates extensions Cargo.toml Cargo.lock)"
          echo "TIKZARIUM_APP_TREE_SHA=$(git rev-parse HEAD:crates/tikzarium-app/src)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pgfplots-native-logs"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/pgfplots-native-logs/source-commit.txt"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
          components: rustfmt
      # Reuse the audited lockfile as the dependency key; keep exact-head
      # entries and scoped restores. I61 can also reuse this verified build cache.
      - name: Restore Cargo dependencies and build products
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-pgfplots-native-rust191-${{ hashFiles('Cargo.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-pgfplots-native-rust191-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-sci-compact-rust191-${{ hashFiles('Cargo.lock') }}-
      - name: Install disposable hosted X11, external XeLaTeX and PDF inspectors
        shell: bash
        run: |
          set -euo pipefail
          # Bound the previously observed Azure archive stalls on hosted jobs.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends \
            xvfb xauth x11-utils openbox xdotool xclip wmctrl imagemagick python3-pil \
            libgl1-mesa-dri libglx-mesa0 libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev \
            texlive-xetex texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-lang-cyrillic \
            fonts-dejavu-core fonts-sil-charis poppler-utils
          { uname -a; rustc -vV; cargo --version; xelatex --version; } > "$RUNNER_TEMP/pgfplots-native-logs/environment.txt"
          kpsewhich pgfplots.sty
          kpsewhich pgfplotstable.sty
          kpsewhich booktabs.sty
          kpsewhich standalone.cls
          fc-match 'DejaVu Sans'
          fc-match 'Charis SIL'
          test "$(fc-match -f '%{family}' 'Charis SIL')" = 'Charis SIL'
          test "$(fc-match -f '%{family}' 'DejaVu Serif')" = 'DejaVu Serif'
          python3 -c 'from PIL import Image; import shutil; tools=("pdfinfo","pdftotext","pdffonts","pdftoppm"); assert all(shutil.which(tool) for tool in tools)'
      - name: Formatting and strict PGFPlots evidence contracts (UNIT_EVENT)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          python3 -m unittest discover -s scripts -p qa_pgfplots_vertical_test.py -v 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/artifact-contract-tests.log"
          python3 -m unittest discover -s scripts -p 'qa_at4_*_test.py' -v 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/at4-contract-tests.log"
          python3 -m unittest discover -s scripts -p 'qa_native_plot_*_test.py' -v 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/native-plot-contract-tests.log"
          python3 -m unittest discover -s scripts/tests -p 'test_qa_pgfplots_clean*.py' -v 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/clean-derivative-contract-tests.log"
          python3 scripts/qa_pgfplots_clean_derivatives.py --verify
          cargo test --locked -p tikzarium-app --bin tikzarium-app scientific_inspector::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/inspector-contract-tests.log"
      - name: Build locked production app and CLI, then bind their exact source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p tikzarium-app -p tikzarium-cli --bin tikzarium-app --bin tikzarium-cli 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/production-build.log"
          test -z "$(git status --porcelain -- crates extensions Cargo.toml Cargo.lock)"
          test "$(git rev-parse HEAD)" = "$TIKZARIUM_SOURCE_SHA"
          test "$(git rev-parse HEAD:crates/tikzarium-app/src)" = "$TIKZARIUM_APP_TREE_SHA"
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          app = (root / 'target/debug/tikzarium-app').resolve(strict=True)
          cli = (root / 'target/debug/tikzarium-cli').resolve(strict=True)
          receipt = {
              'schema_version': 1,
              'created_utc': datetime.now(timezone.utc).isoformat(),
              'source_head_sha': os.environ['TIKZARIUM_SOURCE_SHA'],
              'app_tree_sha': os.environ['TIKZARIUM_APP_TREE_SHA'],
              'app_path': str(app), 'app_sha256': digest(app),
              'cli_path': str(cli), 'cli_sha256': digest(cli),
              'cargo_lock_sha256': digest(root / 'Cargo.lock'),
              'build_command': 'cargo build --locked -p tikzarium-app -p tikzarium-cli --bin tikzarium-app --bin tikzarium-cli',
              'production_binary': True,
              'rustc_version': subprocess.check_output(['rustc', '-vV'], text=True),
              'environment': 'GITHUB_HOSTED_UBUNTU_24_04_XVFB_1366_768',
              'physical_win10': 'NOT_RUN',
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pgfplots-build-provenance.json'
          destination.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
      # Preserve a verified build before native calibration, even when a later
      # GUI assertion fails. A restored cache never replaces the locked build
      # command or the exact source/binary receipt above.
      - name: Save verified build for subsequent native evidence runs
        if: matrix.suite == 'v2' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Real production PGFPlots axis/series Apply, common Undo, Save/reopen and current XeLaTeX PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgfplots-native-runtime"
          chmod 700 "$RUNNER_TEMP/pgfplots-native-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/pgfplots-native-runtime"
          xvfb-run -a -s '-screen 0 1366x768x24 +extension GLX +render -noreset' bash -euo pipefail -c '
            openbox --sm-disable > "$RUNNER_TEMP/pgfplots-native-logs/openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 100); do
              if wmctrl -m > "$RUNNER_TEMP/pgfplots-native-logs/window-manager.txt" 2>&1 && grep -Fq "Name: Openbox" "$RUNNER_TEMP/pgfplots-native-logs/window-manager.txt"; then ready=1; break; fi
              sleep 0.1
            done
            test "$ready" = 1
            python3 scripts/qa_pgfplots_vertical_x11.py \
              --app "$GITHUB_WORKSPACE/target/debug/tikzarium-app" \
              --out "$RUNNER_TEMP/pgfplots-native" \
              --suite "$TIKZARIUM_PGF_SUITE" \
              --build-provenance "$RUNNER_TEMP/pgfplots-build-provenance.json"
          ' 2>&1 | tee "$RUNNER_TEMP/pgfplots-native-logs/native-driver.log"
      - name: Capture original AT4 reference PDFs for independent scientific comparison (external, not GUI)
        if: always() && matrix.suite == 'at4'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_at4_original_references.py --out "$RUNNER_TEMP/at4-original-references"
      - name: Compare pinned originals with attributed clean derivatives (external compile isolation, not GUI)
        if: always() && matrix.suite == 'v2-clean'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_pgfplots_clean_isolation.py --out "$RUNNER_TEMP/pgfplots-clean-isolation"
      - name: Preserve original hosted GUI evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pgfplots-native-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgfplots-native/
            ${{ runner.temp }}/pgfplots-native-logs/
            ${{ runner.temp }}/at4-original-references/
            ${{ runner.temp }}/pgfplots-clean-isolation/
            ${{ runner.temp }}/pgfplots-build-provenance.json
            !${{ runner.temp }}/pgfplots-native/**/*.ttf
            !${{ runner.temp }}/pgfplots-native/**/*.otf
            !${{ runner.temp }}/pgfplots-native/**/*.exe
          if-no-files-found: warn
          retention-days: 14

  scientific-visual-guide:
    name: Visual Guide from current native interfaces
    needs: pgfplots-bounded-hosted-gui
    # Original warning failures remain failures. The guide consumes only the
    # separately successful AT4/clean jobs and same-source shell evidence.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      TIKZARIUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact documented application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and guide input contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TIKZARIUM_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/scientific-visual-guide/logs"
          python3 -m unittest discover -s scripts -p 'qa_visual_guide_*_test.py' -v 2>&1 | tee "$RUNNER_TEMP/scientific-visual-guide/logs/input-contract-tests.log"
      - name: Fetch original screenshots bound to successful same-source producers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa_visual_guide_inputs.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$TIKZARIUM_SOURCE_SHA" \
            --pgf-run-id "$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/scientific-visual-guide-inputs" \
            2>&1 | tee "$RUNNER_TEMP/scientific-visual-guide/logs/input-provenance.log"
      - name: Install disposable hosted XeLaTeX and explicit guide fonts
        shell: bash
        run: |
          set -euo pipefail
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-cyrillic fonts-dejavu-core poppler-utils
          test "$(fc-match -f '%{family}' 'DejaVu Sans')" = 'DejaVu Sans'
          test "$(fc-match -f '%{family}' 'DejaVu Sans Mono')" = 'DejaVu Sans Mono'
          metric_path="$(kpsewhich pzdr.tfm)"
          test -f "$metric_path"
          kpsewhich pzdr.tfm > "$RUNNER_TEMP/scientific-visual-guide/logs/tex-font-metrics.txt"
          xelatex --version > "$RUNNER_TEMP/scientific-visual-guide/logs/xelatex-version.txt"
          fc-match -v 'DejaVu Sans' > "$RUNNER_TEMP/scientific-visual-guide/logs/font-sans.txt"
          fc-match -v 'DejaVu Sans Mono' > "$RUNNER_TEMP/scientific-visual-guide/logs/font-mono.txt"
      - name: Generate portable source with unchanged original PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/visual_guide/build_guide.py \
            --evidence-root "$RUNNER_TEMP/scientific-visual-guide-inputs" \
            --evidence-index evidence-index.json \
            --source-sha "$TIKZARIUM_SOURCE_SHA" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output-dir "$RUNNER_TEMP/scientific-visual-guide" \
            2>&1 | tee "$RUNNER_TEMP/scientific-visual-guide/logs/generate.log"
          mkdir -p "$RUNNER_TEMP/scientific-visual-guide/source"
          cp scripts/visual_guide/* "$RUNNER_TEMP/scientific-visual-guide/source/"
          cp "$RUNNER_TEMP/scientific-visual-guide-inputs/evidence-index.json" "$RUNNER_TEMP/scientific-visual-guide/source/"
      - name: Compile the guide and render every page for independent review
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/scientific-visual-guide"
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -no-shell-escape -recorder guide.tex > logs/xelatex-pass1.txt 2>&1
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -no-shell-escape -recorder guide.tex > logs/xelatex-pass2.txt 2>&1
          if grep -E 'Missing character:|Overfull \\[hv]box|LaTeX Font Warning:.*undefined' guide.log; then
            exit 1
          fi
          pdfinfo guide.pdf > logs/pdfinfo.txt
          pdffonts guide.pdf > logs/pdffonts.txt
          pdftotext -layout guide.pdf logs/guide-text.txt
          mkdir -p rendered
          pdftoppm -r 120 -png guide.pdf rendered/page
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          manifest = json.loads((root / 'resolved_manifest.json').read_text())
          pages = sorted(root.glob('rendered/page-*.png'))
          assert len(pages) == len(manifest['screens']) + 3, 'Guide page count differs from the designed cover/navigation/workflow plus one page per original screen'
          font_rows = (root / 'logs/pdffonts.txt').read_text().splitlines()[2:]
          assert font_rows, 'No embedded guide fonts'
          for row in font_rows:
              fields = row.split()
              assert len(fields) >= 8 and fields[-5] == 'yes', 'A guide font is not embedded'
          pdf = root / 'guide.pdf'
          receipt = {'schema_version': 1, 'status': 'COMPILED_REQUIRES_INDEPENDENT_PAGE_REVIEW',
                     'source_head_sha': manifest['build']['source_sha'],
                     'generator_source_sha': manifest['build']['source_sha'],
                     'evidence_source_sha': manifest['build']['source_sha'],
                     'pdf_sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
                     'pdf_bytes': pdf.stat().st_size, 'rendered_page_count': len(pages),
                     'original_screen_count': len(manifest['screens']),
                     'fonts_explicit': ['DejaVu Sans', 'DejaVu Sans Mono'],
                     'native_platform_acceptance': 'NOT_ESTABLISHED_BY_THIS_GUIDE',
                     'files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                               for p in sorted(root.rglob('*')) if p.is_file()}}
          (root / 'guide-build-report.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Preserve the guide, original PNGs, portable source and all build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-visual-guide-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scientific-visual-guide/
          if-no-files-found: error
          retention-days: 14
