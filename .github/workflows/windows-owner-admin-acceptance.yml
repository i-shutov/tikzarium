name: Windows owner Administrator regression and original PDF acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: ['Windows Server MiKTeX QA (trusted main + manual; not Win10)']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  native-policy-and-transport:
    if: github.event_name != 'workflow_run'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.91.0'
          components: rustfmt
      - name: Native transport preserves warning plus exit zero and real failures
        shell: powershell
        run: ./scripts/maintenance/test_native_process.ps1 -OutputDir "$env:RUNNER_TEMP\owner-admin-transport"
      - name: Python-independent PE parser positive and negative cases
        shell: powershell
        run: ./scripts/tools/test_windows_native_pe.ps1
      - name: Parse personal W2 per-app Mesa stage under real Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@('scripts/tools/qa_windows_server_mesa_stage.ps1','scripts/tools/qa_windows_server_interactive.ps1','scripts/tools/qa_windows_owned_foreground.ps1','scripts/tools/test_qa_windows_owned_foreground.ps1','scripts/tools/test_qa_windows_startup_responsive.ps1','scripts/tools/qa_windows_w2_binary.ps1')
          foreach($path in $files){
            $tokens=$null
            $errors=$null
            $full=(Resolve-Path -LiteralPath $path).Path
            [System.Management.Automation.Language.Parser]::ParseFile($full,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){
              throw "$path PowerShell 5.1 parse failed: $($errors[0].Message)"
            }
          }
          Write-Host 'W2_PS51_PINNED_MESA_PARSER=PASS_6_FILES_NOT_PHYSICAL'
      - name: Transport probe PowerShell 5.1 parser and safe synthetic selftest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path -LiteralPath 'scripts/tools/qa_windows_server_transport_probe.ps1').Path
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){throw "W2 transport probe parse failed: $($errors[0].Message)"}
          ./scripts/tools/qa_windows_server_transport_probe.ps1 -SelfTest
      - name: Native DPI capture scope restores caller context on success and rejection
        shell: powershell
        run: |
          . ./scripts/tools/qa_windows_owned_client_capture.ps1
          Test-TikzariumCaptureDpiScope
          python -m unittest discover -s scripts/tools -p 'test_qa_windows_capture*.py' -v
          if($LASTEXITCODE -ne 0){throw 'Physical-pixel capture contracts failed'}
      - name: Personal W2 temporary-Mesa source-provenance negative contract tests
        shell: powershell
        run: |
          python -m unittest discover -s scripts/tools -p 'test_qa_windows_server_mesa.py' -v
          if($LASTEXITCODE -ne 0){throw 'W2 private Mesa SHA/trusted-main regression tests failed'}
      - name: Release docs and W2 owned-foreground negative contracts
        shell: powershell
        run: |
          python -m unittest discover -s scripts/tools -p 'test_release_1_0_docs_and_w2_focus.py' -v
          if($LASTEXITCODE -ne 0){throw 'Windows 1.0 docs/foreground evidence integrity tests failed'}
      - name: W2b owned native Save As dialog PID negative tests (no dialog or input)
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_owned_save_dialog.ps1 -SelfTest
      - name: Real W2b stage1 input guard synthetic self-tests (no HWND or desktop input)
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_w2b_stage1.ps1 -SelfTest
      - name: Native Windows tar MSYS2 QA extraction offline guard (no installer, no network)
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_msys2_tar_stage.ps1 -SelfTest
      - name: Pinned QA Mesa HTTPS retry and SHA mismatch negative tests (no network)
        shell: powershell
        run: |
          ./scripts/tools/qa_windows_pinned_mesa_fetch.ps1 -SelfTest
      - name: Windows real-desktop preflight negative cases (synthetic only)
        shell: powershell
        run: ./scripts/tools/qa_windows_server_interactive.ps1 -SelfTest
      - name: W2 uploaded-evidence negative regressions on hosted Windows
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tools -p 'test_qa_windows_server_w2_uploaded.py' -v
          if($LASTEXITCODE -ne 0){throw 'W2 fake-physical-PASS negative evidence tests FAILED'}
          # W2b stage1 original-bytes auditor must reject forged success/Win10 even
          # under optimized Python; this is offline negative QA, NOT physical W2b.
          python -m unittest discover -s scripts/tools -p 'test_qa_windows_server_w2b_uploaded.py' -v
          if($LASTEXITCODE -ne 0){throw 'W2b stage1 fake-physical evidence tests FAILED'}
      - name: Format and actual Windows core token regressions
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if($LASTEXITCODE -ne 0){throw 'Rust formatting failed'}
          cargo test --locked -p tikzarium-core
          if($LASTEXITCODE -ne 0){throw 'Actual Windows core tests failed'}
          cargo build --locked --release -p tikzarium-cli
          if($LASTEXITCODE -ne 0){throw 'Actual Windows native CLI build failed'}
      - name: Original native CLI imports and executable smoke without Python
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/tools/windows_native_pe.ps1
          . ./scripts/maintenance/native_process.ps1
          $dir=Join-Path $env:RUNNER_TEMP 'owner-admin-transport'
          $pe=Get-TikzariumPortablePe -Path target/release/tikzarium-cli.exe -ExpectedSubsystem 3
          $pe | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $dir 'actual-cli-pe.json') -Encoding UTF8
          $r=Invoke-TikzNative -Exe $pe.path -Arguments @('help','--all') -WorkingDirectory (Get-Location).Path -LogPrefix (Join-Path $dir 'actual-cli-help') -TimeoutSeconds 30
          if($r.timed_out -or $r.exit_code -ne 0 -or $r.stdout -notmatch 'tikz.circle'){throw 'Actual executable help proof failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-admin-native-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/owner-admin-transport/
          if-no-files-found: warn
  independent-original-server-pdf:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tikzarium-user-winserver-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .qa-server-original
      - name: Disposable Linux PDF inspection tools (no user-server installation)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y poppler-utils
      - name: Actual uploaded Windows PDF SHA fonts and Cyrillic
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 scripts/tools/qa_windows_server_uploaded.py
          --root .qa-server-original
          --source-sha "$EXPECTED_SOURCE_SHA"
          --fixture examples/windows-cyrillic.tex
      - name: Re-audit original uploaded W2 real-window evidence (never claim full W2)
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 -m unittest discover -s scripts/tools -p 'test_qa_windows_server_w2_uploaded.py'
          python3 scripts/tools/qa_windows_server_w2_uploaded.py --root .qa-server-original --source-sha "$EXPECTED_SOURCE_SHA"
      - name: Independently validate original personal Server W2b stage1 evidence (only if attempted)
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # W2a/W1 remain independently qualified even if the new optional
          # W2b stage was not reached. Never invent stage1 evidence.
          report=.qa-server-original/w2-interactive/w2b-stage1/w2b-stage1-original.json
          if test -f "$report"; then
            python3 -m unittest discover -s scripts/tools -p 'test_qa_windows_server_w2b_uploaded.py' -v
            python3 scripts/tools/qa_windows_server_w2b_uploaded.py --root .qa-server-original --source-sha "$EXPECTED_SOURCE_SHA"
          else
            echo 'W2B_STAGE1=NOT_RUN_OR_UNHANDLED (no original report; W2a unaffected)'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-admin-original-pdf-audit-${{ github.event.workflow_run.id }}
          path: |
            .qa-server-original/independent-pdf-audit.json
            .qa-server-original/pdfinfo.txt
            .qa-server-original/pdffonts.txt
            .qa-server-original/pdftotext.txt
            .qa-server-original/product-pdf-preview.png
            .qa-server-original/windows-server-w2-interactive.json
            .qa-server-original/independent-w2-window-audit.json
            .qa-server-original/independent-w2b-stage1-audit.json
            .qa-server-original/w2-interactive/
            .qa-server-original/owner-admin-proof/
          if-no-files-found: warn
