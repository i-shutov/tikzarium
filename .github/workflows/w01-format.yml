name: W01 one-time rustfmt bootstrap
on:
  push:
    branches: [feat/w01-xelatex-egui-core]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/w01-xelatex-egui-core
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Format Rust files and publish mechanical patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet -- crates/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/
            git commit -m "style: rustfmt W01 Rust sources"
            git push origin HEAD:feat/w01-xelatex-egui-core
          fi
